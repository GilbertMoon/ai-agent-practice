<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" width="1200" height="610" role="img"><title>키워드 검색과 의미 벡터 검색의 차이</title><rect width="1200" height="610" fill="#f7f9fe"/><text x="52" y="70" font-size="38" font-family="Arial,sans-serif" font-weight="bold" fill="#183454">같은 뜻, 다른 단어를 어떻게 찾을까요?</text><rect x="64" y="125" width="1040" height="85" rx="15" fill="#e2edff"/><text x="584" y="178" text-anchor="middle" font-size="27" font-family="Arial,sans-serif" fill="#234b85">질문: “마감일이 언제인가요?”</text><rect x="64" y="264" width="480" height="240" rx="19" fill="#fff0e5" stroke="#d89a61" stroke-width="3"/><rect x="625" y="264" width="479" height="240" rx="19" fill="#e3f4e9" stroke="#5d9f78" stroke-width="3"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#3e4d60"><text x="304" y="318" font-size="29" font-weight="bold">키워드 일치</text><text x="864" y="318" font-size="29" font-weight="bold">벡터 유사도</text><text x="304" y="371" font-size="22">“마감일” 단어가 없으면</text><text x="304" y="408" font-size="22">검색 실패 가능</text><text x="864" y="371" font-size="22">“제출 기한”과 “마감일”의</text><text x="864" y="408" font-size="22">의미를 비교하도록 설계</text></g><text x="583" y="244" font-family="Arial,sans-serif" text-anchor="middle" font-size="22" fill="#375777">공지: “과제 제출 기한은 금요일 오후 6시”</text><text x="583" y="557" font-family="Arial,sans-serif" text-anchor="middle" font-size="20" fill="#536174">Fixture는 수동 벡터로 원리를 설명 · 실제 의미 임베딩은 별도 모델 API가 필요</text></svg>