<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="840" viewBox="0 0 1500 840" role="img" aria-label="로컬 검사 시간 ≠ 실제 LLM 응답 지연"><title>로컬 검사 시간 ≠ 실제 LLM 응답 지연</title><rect width="1500" height="840" fill="#f5f8fc"/><rect x="28" y="28" width="1444" height="782" rx="18" fill="#fff" stroke="#c3d6e7" stroke-width="3"/><text x="66" y="92" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="42" fill="#173d69" font-weight="800" text-anchor="start">로컬 검사 시간 ≠ 실제 LLM 응답 지연</text><text x="66" y="141" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="23" fill="#55728e" font-weight="500" text-anchor="start">이번 코드의 perf_counter()는 답 문자열·출처 필드 검사에만 걸리는 시간을 측정합니다.</text><rect x="70" y="220" width="1360" height="178" rx="18" fill="#e9f7ef" stroke="#c3d6e7" stroke-width="3"/><text x="108" y="267" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="29" fill="#18734c" font-weight="800" text-anchor="start">실제로 측정하는 구간 (Fixture)</text><text x="108" y="329" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="25" fill="#24614b" font-weight="500" text-anchor="start">[평가 함수 시작] → 문자열 비교·출처 확인 → [평가 함수 종료]</text><text x="108" y="368" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="24" fill="#24614b" font-weight="700" text-anchor="start">local_check_ms  =  로컬 검사 함수 실행 시간</text><rect x="70" y="440" width="1360" height="174" rx="18" fill="#f3f4f8" stroke="#c3d6e7" stroke-width="3"/><text x="108" y="485" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="29" fill="#6d6f81" font-weight="800" text-anchor="start">이번 강의에서 측정하지 않는 구간 (실제 API)</text><text x="108" y="548" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="25" fill="#6d6f81" font-weight="500" text-anchor="start">[API 요청] → 네트워크 → 모델 생성 → [응답 수신]</text><text x="108" y="582" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="23" fill="#8f5260" font-weight="700" text-anchor="start">실제 LLM latency / TTFT / 재시도 시간 = 미측정</text><text x="90" y="683" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="25" fill="#9a4a42" font-weight="800" text-anchor="start">로컬 계산 시간으로 모델의 속도나 SLA를 설명하면 안 됩니다.</text><text x="66" y="776" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="19" fill="#6a8097" font-weight="500" text-anchor="start">Lesson 13 · 교육용 Fixture / 실제 모델 성능·API 비용 측정 아님</text></svg>