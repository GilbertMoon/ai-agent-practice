<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="도구 실행 후 모델에 결과 돌려주기"><title>도구 실행 후 모델에 결과 돌려주기</title><rect width="1200" height="640" fill="#f7f9fc"/><text x="45" y="70" font-size="37" font-family="Arial,sans-serif" font-weight="bold" fill="#153d60">도구 실행 후 모델에 결과 돌려주기</text><text x="48" y="113" font-size="21" font-family="Arial,sans-serif" fill="#536b80">요청만으로 도구가 실행되지 않습니다. 실행·검증은 프로그램 책임입니다.</text><rect x="45" y="216" width="265" height="214" rx="17" fill="#e0edff" stroke="#7a9cb9" stroke-width="2"/><text x="62" y="256" font-size="23" font-weight="bold" font-family="Arial,sans-serif" fill="#173e61">1. 모델 요청</text><text x="62" y="294" font-size="20" font-family="Arial,sans-serif" fill="#345873">function_call</text><text x="62" y="330" font-size="20" font-family="Arial,sans-serif" fill="#345873">name + arguments</text><path d="M313 307 h65 m-15 -11 l15 11 -15 11" stroke="#3a75a4" stroke-width="4" fill="none"/><rect x="405" y="216" width="260" height="214" rx="17" fill="#eaf4e5" stroke="#7a9cb9" stroke-width="2"/><text x="422" y="256" font-size="23" font-weight="bold" font-family="Arial,sans-serif" fill="#173e61">2. 프로그램</text><text x="422" y="294" font-size="20" font-family="Arial,sans-serif" fill="#345873">allowlist · JSON</text><text x="422" y="330" font-size="20" font-family="Arial,sans-serif" fill="#345873">실제 함수 실행</text><path d="M667 307 h65 m-15 -11 l15 11 -15 11" stroke="#3a75a4" stroke-width="4" fill="none"/><rect x="758" y="216" width="395" height="214" rx="17" fill="#f2e9ff" stroke="#7a9cb9" stroke-width="2"/><text x="775" y="256" font-size="23" font-weight="bold" font-family="Arial,sans-serif" fill="#173e61">3. 결과 반환</text><text x="775" y="294" font-size="20" font-family="Arial,sans-serif" fill="#345873">function_call_output</text><text x="775" y="330" font-size="20" font-family="Arial,sans-serif" fill="#345873">모델 답변 또는 HOLD</text><text x="48" y="609" font-size="19" font-family="Arial,san