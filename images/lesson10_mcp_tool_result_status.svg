<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="840" viewBox="0 0 1500 840" role="img" aria-label="MCP 연결 성공과 도구 실행 성공은 다릅니다"><title>MCP 연결 성공과 도구 실행 성공은 다릅니다</title><rect width="1500" height="840" fill="#f5f8fc"/><rect x="24" y="24" width="1452" height="792" rx="18" fill="#ffffff" stroke="#d8e3f1" stroke-width="3"/><text x="62" y="90" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="43" fill="#153e67" font-weight="800" text-anchor="start">MCP 연결 성공과 도구 실행 성공은 다릅니다</text><text x="64" y="135" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="23" fill="#506884" font-weight="500" text-anchor="start">연결·세션이 정상이어도 Tool 결과 isError가 true라면 작업은 실패입니다.</text><rect x="120" y="195" width="1260" height="107" rx="18" fill="#e8f0ff" stroke="#c1d1e5" stroke-width="3"/><text x="170" y="246" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="27" fill="#1f4c7c" font-weight="800" text-anchor="start">MCP Client → MCP Server · 세션 초기화 · tools/call</text><text x="170" y="278" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="21" fill="#153e67" font-weight="500" text-anchor="start">결과가 반환되었다고 모두 정상 실행인 것은 아닙니다.</text><path d="M748 312 L748 381" stroke="#477cad" stroke-width="5" fill="none"/><path d="M736 372 L748 381 L736 390" stroke="#477cad" stroke-width="4" fill="none"/><rect x="120" y="407" width="590" height="255" rx="18" fill="#e6f6ed" stroke="#9bd4b1" stroke-width="3"/><rect x="790" y="407" width="590" height="255" rx="18" fill="#fff0ee" stroke="#e3aaa5" stroke-width="3"/><text x="154" y="464" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="30" fill="#167044" font-weight="800" text-anchor="start">✓ isError = false</text><text x="154" y="512" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="27" fill="#236a4c" font-weight="700" text-anchor="start">결과: {sum: 42}</text><text x="154" y="567" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="26" fill="#236a4c" font-weight="800" text-anchor="start">[MCP_TOOL_OK]</text><text x="154" y="613" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="22" fill="#153e67" font-weight="500" text-anchor="start">작업 성공 · 정상 종료 후보</text><text x="825" y="464" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="30" fill="#ad403a" font-weight="800" text-anchor="start">✕ isError = true</text><text x="825" y="512" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="26" fill="#8a4944" font-weight="700" text-anchor="start">결과: Tool 오류 정보</text><text x="825" y="567" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="26" fill="#ad403a" font-weight="800" text-anchor="start">[MCP_TOOL_ERROR]</text><text x="825" y="613" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="22" fill="#153e67" font-weight="500" text-anchor="start">작업 실패 · 종료 코드 4</text><text x="135" y="724" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="23" fill="#1e456d" font-weight="700" text-anchor="start">시험 전 핵심 질문: “서버와 통신했으니 계산도 성공했을까요?” → 반드시 Tool 결과를 확인해야 합니다.</text><text x="65" y="790" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="18" fill="#657b92" font-weight="500" text-anchor="start">Lesson 10 · 개념 설명용 그림이며 실제 테스트 실행 결과가 아닙니다.</text></svg>