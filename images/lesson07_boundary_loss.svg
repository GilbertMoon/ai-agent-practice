<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="청크 경계에서 정답 문구가 잘리면?"><title>청크 경계에서 정답 문구가 잘리면?</title><rect width="1280" height="720" fill="#f6f8fc"/><rect x="32" y="28" width="1216" height="664" rx="22" fill="#fff" stroke="#cfdded" stroke-width="3"/><text x="68" y="90" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="39" font-weight="800" fill="#143b68">청크 경계에서 정답 문구가 잘리면?</text><text x="68" y="131" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="21" fill="#435b77">질문: ‘과제 마감일은?’  /  필요한 근거: ‘금요일 오후 6시’</text><rect x="55" y="169" width="1170" height="205" rx="14" fill="#fff0ee" stroke="#e5a8a3" stroke-width="2"/><text x="78" y="214" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="25" font-weight="800" fill="#ae3434">Overlap 없음: 정답 근거가 청크 경계에서 나뉘는 예</text><rect x="86" y="250" width="512" height="78" rx="14" fill="#fff" stroke="#9cb5d0" stroke-width="2"/><rect x="620" y="250" width="512" height="78" rx="14" fill="#fff" stroke="#9cb5d0" stroke-width="2"/><text x="109" y="295" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="25" font-weight="500" fill="#204567">청크 1 : 과제 마감은</text><text x="643" y="295" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="25" font-weight="500" fill="#204567">청크 2 : 금요일 오후 6시입니다</text><text x="83" y="355" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="18" font-weight="500" fill="#814e46">※ 실제 경계는 크기 설정에 따라 달라집니다.</text><rect x="55" y="398" width="1170" height="205" rx="14" fill="#eaf6ee" stroke="#9ccead" stroke-width="2"/><text x="78" y="440" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="25" font-weight="800" fill="#1d7546">Overlap 적용: 두 청크에 겹치는 내용을 보존할 수 있음</text><rect x="86" y="478" width="512" height="76" rx="14" fill="#fff" stroke="#9cb5d0" stroke-width="2"/><rect x="620" y="478" width="512" height="76" rx="14" fill="#fff" stroke="#9cb5d0" stroke-width="2"/><text x="105" y="524" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="24" font-weight="500" fill="#204567">청크 1 : 과제 마감은 금요일</text><text x="638" y="524" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="24" font-weight="500" fill="#204567">청크 2 : 금요일 오후 6시입니다</text><rect x="481" y="560" width="304" height="32" rx="14" fill="#d8c8fa" stroke="#b99de2" stroke-width="2"/><text x="506" y="583" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="18" font-weight="700" fill="#6442a2">공유 문맥(겹침) 예시</text><text x="68" y="636" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="20" font-weight="700" fill="#8b542e">중요: 중첩이 항상 정답 문구 전체를 보존하거나 검색 정확도를 높이는 것은 아닙니다.</text><text x="68" y="667" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="18" fill="#61768c">Lesson 07 · 설명용 개념 그림 (실측 결과 아님)</text></svg>