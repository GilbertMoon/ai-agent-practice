<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="Fixture와 Live 검증을 구분하기"><title>Fixture와 Live 검증을 구분하기</title><rect width="1200" height="640" fill="#f7f9fc"/><text x="50" y="73" font-size="36" font-weight="bold" fill="#173e60" font-family="Arial,sans-serif">Fixture와 Live 검증을 구분하기</text><text x="52" y="116" font-size="20" fill="#53697f" font-family="Arial,sans-serif">교육용 규칙과 실제 모델의 의미 검색 성능을 혼동하지 않습니다.</text><rect x="45" y="175" width="515" height="335" rx="16" fill="#e4f0ff" stroke="#7197b8" stroke-width="2"/><text x="63" y="214" font-size="23" font-family="Arial,sans-serif" font-weight="bold" fill="#153f62">Fixture · 기본 실습</text><text x="63" y="250" font-size="20" font-family="Arial,sans-serif" fill="#28516f">사람이 정의한 3차원 벡터</text><text x="63" y="284" font-size="20" font-family="Arial,sans-serif" fill="#28516f">오프라인 평가 · 비용 없음</text><text x="63" y="318" font-size="20" font-family="Arial,sans-serif" fill="#28516f">검색 흐름과 지표 계산 확인</text><text x="63" y="352" font-size="20" font-family="Arial,sans-serif" fill="#28516f">일반적 의미 검색 성능 아님</text><rect x="633" y="175" width="515" height="335" rx="16" fill="#e8f3e8" stroke="#7197b8" stroke-width="2"/><text x="651" y="214" font-size="23" font-family="Arial,sans-serif" font-weight="bold" fill="#153f62">Live · 선택 실습</text><text x="651" y="250" font-size="20" font-family="Arial,sans-serif" fill="#28516f">실제 Embeddings API 사용</text><text x="651" y="284" font-size="20" font-family="Arial,sans-serif" fill="#28516f">모델 접근 권한·비용 확인</text><text x="651" y="318" font-size="20" font-family="Arial,sans-serif" fill="#28516f">같은 평가 질문·지표 비교</text><text x="651" y="352" font-size="20" font-family="Arial,sans-serif" fill="#28516f">응답 생성은 추가 API 호출</text><text x="50" y="615" font-size="18" fill="#58748c" font-family="Arial,sans-serif">Lesson 08 · Retrieval Quality &amp; Evidence Grounding</text></svg>