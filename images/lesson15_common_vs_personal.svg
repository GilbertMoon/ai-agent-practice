<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="840" viewBox="0 0 1500 840" role="img" aria-label="공통 Fixture 검증과 개인 AI 비서의 통합은 다릅니다"><title>공통 Fixture 검증과 개인 AI 비서의 통합은 다릅니다</title><rect width="1500" height="840" fill="#f6f9fd"/><rect x="22" y="22" width="1456" height="794" rx="18" fill="#fff" stroke="#c7d6e7" stroke-width="3"/><text x="65" y="92" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="40" fill="#163e6b" font-weight="800">공통 Fixture 검증과 개인 AI 비서의 통합은 다릅니다</text><text x="65" y="137" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="22" fill="#5a7690" font-weight="500">공통 시험 5/5를 통과해도 학생이 선택한 실제 기능의 연결·실행·검증은 별도입니다.</text><rect x="65" y="195" width="650" height="480" rx="18" fill="#eaf2ff" stroke="#c7d6e7" stroke-width="3"/><rect x="783" y="195" width="650" height="480" rx="18" fill="#e8f6ed" stroke="#c7d6e7" stroke-width="3"/><text x="100" y="251" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="29" fill="#1f4f81" font-weight="800">공통 필수: LOCAL_FIXTURE_API</text><text x="100" y="312" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="26" fill="#193e67" font-weight="500">TestClient / FastAPI</text><text x="100" y="372" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="25" fill="#193e67" font-weight="500">health · known · hold</text><text x="100" y="418" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="25" fill="#193e67" font-weight="500">invalid · failure</text><text x="100" y="502" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="27" fill="#1c578b" font-weight="800">5/5 PASS = Fixture 검증</text><text x="100" y="585" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="21" fill="#193e67" font-weight="500">Live 모델 / 배포는 증명하지 않음</text><text x="817" y="251" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="29" fill="#19744d" font-weight="800">개인 프로젝트 선택 기능</text><text x="817" y="312" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="25" fill="#193e67" font-weight="500">예: RAG · Tool · Memory 중 1개</text><text x="817" y="372" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="25" fill="#193e67" font-weight="500">① 실제 연결 코드</text><text x="817" y="418" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="25" fill="#193e67" font-weight="500">② 실행 결과·근거</text><text x="817" y="465" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="25" fill="#193e67" font-weight="500">③ 실패·HOLD 검증</text><text x="817" y="518" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="25" fill="#193e67" font-weight="500">④ 미구현·미실행 명시</text><text x="817" y="593" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="22" fill="#89622c" font-weight="800">선택 구현 없으면 DESIGN_ONLY</text><text x="86" y="722" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="23" fill="#2a4d75" font-weight="800">완료 표현은 검증한 범위로 한정: 로컬 게이트 PASS ≠ 전체 AI 비서 구현 완료</text><text x="66" y="776" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="18" fill="#6c8197" font-weight="500">Lesson 15 · 개념 설명용 그림 / 실제 테스트 실행 증거 아님</text></svg>