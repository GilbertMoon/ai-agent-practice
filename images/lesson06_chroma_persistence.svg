<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img"><title>Lesson 06 Chroma에 벡터 저장하고 재실행해서 검색하기</title><rect width="1200" height="640" fill="#f6f8fc"/><text x="48" y="70" font-size="36" font-family="Arial,sans-serif" font-weight="bold" fill="#173553">문서를 한 번 저장하고, 다시 열어 검색하기</text><rect x="48" y="125" width="305" height="185" rx="18" fill="#e2edff" stroke="#7198c3" stroke-width="2"/><text x="202" y="170" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="29" fill="#214c7a">STEP 1 · index</text><text x="202" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#234764">문서 3개 문단</text><text x="202" y="257" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#234764">→ 벡터 + 출처</text><path d="M365 216 L435 216" stroke="#63859f" stroke-width="6"/><path d="M429 203 L450 216 L429 229" fill="none" stroke="#63859f" stroke-width="6"/><rect x="468" y="122" width="300" height="340" rx="22" fill="#e5f3e9" stroke="#679b74" stroke-width="3"/><text x="618" y="169" font-family="Arial,sans-serif" font-size="29" font-weight="bold" text-anchor="middle" fill="#205d3b">Chroma 저장소</text><rect x="501" y="201" width="234" height="59" rx="9" fill="white"/><text x="618" y="240" font-size="20" text-anchor="middle" font-family="Arial,sans-serif" fill="#334b3f">id · 문단 · metadata</text><rect x="501" y="277" width="234" height="59" rx="9" fill="white"/><text x="618" y="315" font-size="20" text-anchor="middle" font-family="Arial,sans-serif" fill="#334b3f">벡터 · cosine distance</text><rect x="501" y="352" width="234" height="59" rx="9" fill="white"/><text x="618" y="390" font-size="20" text-anchor="middle" font-family="Arial,sans-serif" fill="#334b3f">디스크에 영속 저장</text><path d="M779 240 L849 240" stroke="#63859f" stroke-width="6"/><path d="M841 227 L860 240 L841 253" fill="none" stroke="#63859f" stroke-width="6"/><rect x="875" y="126" width="269" height="185" rx="18" fill="#fff1e1" stroke="#d69b68" stroke-width="2"/><text x="1009" y="169" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="29" fill="#8a4e27">STEP 2 · query</text><text x="1009" y="219" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#855331">프로그램 다시 실행</text><text x="1009" y="256" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#855331">질문 벡터로 검색</text><text x="600" y="522" font-family="Arial,sans-serif" font-size="23" text-anchor="middle" fill="#35536e">Fixture: 수동 3차원 벡터 · Live: OpenAI 임베딩(선택)</text><text x="600" y="563" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#58718a">검색값은 similarity가 아니라 distance — 작을수록 가깝습니다</text></svg>