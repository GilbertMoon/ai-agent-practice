<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-label="Chunk Size와 Overlap"><title>Chunk Size와 Overlap</title><rect width="1200" height="660" fill="#f6f8fc"/><text x="58" y="72" font-family="Arial,sans-serif" font-weight="700" font-size="37" fill="#143c60">Chunk Size와 Overlap</text><text x="60" y="116" font-family="Arial,sans-serif" font-size="21" fill="#48657b">중첩 영역으로 청크 경계의 문맥 일부를 함께 보존합니다.</text><rect x="65" y="170" width="1060" height="98" rx="16" fill="#f6edda" stroke="#7198bb" stroke-width="2"/><text x="85" y="210" font-family="Arial,sans-serif" font-weight="700" font-size="24" fill="#184c72">원문 흐름</text><text x="85" y="253" font-family="Arial,sans-serif" font-size="21" fill="#23455c">A 문단 → B 문단 → C 문단 → D 문단</text><rect x="70" y="310" width="500" height="135" rx="16" fill="#e3efff" stroke="#7198bb" stroke-width="2"/><text x="90" y="350" font-family="Arial,sans-serif" font-weight="700" font-size="24" fill="#184c72">Chunk 1 · 160자</text><text x="90" y="393" font-family="Arial,sans-serif" font-size="21" fill="#23455c">앞부분 160자</text><text x="90" y="429" font-family="Arial,sans-serif" font-size="21" fill="#23455c">끝 30자가 다음 청크와 중첩</text><rect x="430" y="468" width="690" height="105" rx="16" fill="#e6f3e6" stroke="#7198bb" stroke-width="2"/><text x="450" y="508" font-family="Arial,sans-serif" font-weight="700" font-size="24" fill="#184c72">Chunk 2 · 다음 160자</text><text x="450" y="551" font-family="Arial,sans-serif" font-size="21" fill="#23455c">앞 30자는 Chunk 1의 끝부분과 동일</text><rect x="430" y="310" width="140" height="135" fill="#b7dcff" fill-opacity=".7" stroke="#4785bc" stroke-dasharray="8,5" stroke-width="2"/><text x="445" y="384" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#1e5887">Overlap</text><path d="M 500 448 L 500 468" stroke="#3b6f9c" stroke-width="4"/><text x="60" y="628" font-family="Arial,sans-serif" font-size="19" fill="#536b7e">Lesson 07 · Chunking &amp; Retrieval Quality</text></svg>