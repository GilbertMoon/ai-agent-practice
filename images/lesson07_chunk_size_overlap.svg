<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Chunk Size = 160자, Overlap = 30자"><title>Chunk Size = 160자, Overlap = 30자</title><rect width="1280" height="720" fill="#f6f8fc"/><rect x="32" y="28" width="1216" height="664" rx="22" fill="#fff" stroke="#cfdded" stroke-width="3"/><text x="68" y="90" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="39" font-weight="800" fill="#143b68">Chunk Size = 160자, Overlap = 30자</text><text x="68" y="131" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="21" fill="#435b77">연속 청크의 시작 위치는 160 - 30 = 130자씩 이동합니다.</text><rect x="60" y="163" width="1154" height="100" rx="14" fill="#e9f2fc" stroke="#9cb5d0" stroke-width="2"/><text x="82" y="208" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="25" font-weight="800" fill="#174b88">원문 문자 위치</text><text x="318" y="208" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="23" font-weight="500" fill="#204567">0</text><text x="644" y="208" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="23" font-weight="500" fill="#204567">130</text><text x="719" y="208" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="23" font-weight="500" fill="#204567">160</text><text x="1045" y="208" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="23" font-weight="500" fill="#204567">290</text><rect x="80" y="309" width="658" height="98" rx="14" fill="#dcecff" stroke="#9cb5d0" stroke-width="2"/><text x="105" y="368" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="27" font-weight="800" fill="#1b4e80">Chunk 1 : text[0:160]</text><rect x="611" y="444" width="607" height="98" rx="14" fill="#e9f5e7" stroke="#9cb5d0" stroke-width="2"/><text x="643" y="502" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="27" font-weight="800" fill="#1d6c4e">Chunk 2 : text[130:290]</text><rect x="611" y="309" width="127" height="98" rx="14" fill="#bdacec" stroke="#866ac8" stroke-width="2"/><rect x="611" y="444" width="127" height="98" rx="14" fill="#bdacec" stroke="#866ac8" stroke-width="2"/><text x="623" y="347" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="21" font-weight="800" fill="#472c82">30자</text><text x="623" y="378" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="21" font-weight="800" fill="#472c82">중첩</text><text x="623" y="484" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="21" font-weight="800" fill="#472c82">30자</text><text x="623" y="515" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="21" font-weight="800" fill="#472c82">중첩</text><text x="79" y="590" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="21" font-weight="500" fill="#204567">문자 범위는 시작 포함, 끝 제외 · 마지막 청크는 160자보다 짧을 수 있음</text><text x="79" y="629" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="20" font-weight="700" fill="#9a4c2c">Overlap이 커지면 중복도 증가하므로, 정확성은 검색 결과로 확인해야 합니다.</text><text x="68" y="667" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="18" fill="#61768c">Lesson 07 · 설명용 개념 그림 (실측 결과 아님)</text></svg>