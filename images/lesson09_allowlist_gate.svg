<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="허용 목록과 인자 검증"><title>허용 목록과 인자 검증</title><rect width="1200" height="640" fill="#f7f9fc"/><text x="45" y="70" font-size="37" font-family="Arial,sans-serif" font-weight="bold" fill="#153d60">허용 목록과 인자 검증</text><text x="48" y="113" font-size="21" font-family="Arial,sans-serif" fill="#536b80">임의 명령 실행이 아닌, 미리 등록한 읽기 전용 함수만 허용합니다.</text><rect x="50" y="200" width="450" height="300" rx="17" fill="#e4efff" stroke="#7a9cb9" stroke-width="2"/><text x="67" y="240" font-size="23" font-weight="bold" font-family="Arial,sans-serif" fill="#173e61">요청</text><text x="67" y="278" font-size="20" font-family="Arial,sans-serif" fill="#345873">name: add_numbers</text><text x="67" y="314" font-size="20" font-family="Arial,sans-serif" fill="#345873">arguments: {a:12, b:30}</text><text x="67" y="350" font-size="20" font-family="Arial,sans-serif" fill="#345873">모델이 제시한 구조화 값</text><path d="M519 323 h65 m-15 -11 l15 11 -15 11" stroke="#3a75a4" stroke-width="4" fill="none"/><rect x="615" y="165" width="520" height="160" rx="17" fill="#e3f2e3" stroke="#7a9cb9" stroke-width="2"/><text x="632" y="205" font-size="23" font-weight="bold" font-family="Arial,sans-serif" fill="#173e61">허용·정상</text><text x="632" y="243" font-size="20" font-family="Arial,sans-serif" fill="#345873">함수명 허용 + 타입·범위 적합</text><text x="632" y="279" font-size="20" font-family="Arial,sans-serif" fill="#345873">읽기 전용 함수 호출</text><rect x="615" y="353" width="520" height="162" rx="17" fill="#ffede5" stroke="#7a9cb9" stroke-width="2"/><text x="632" y="393" font-size="23" font-weight="bold" font-family="Arial,sans-serif" fill="#173e61">거부</text><text x="632" y="431" font-size="20" font-family="Arial,sans-serif" fill="#345873">미등록 도구, 불필요한 인자</text><text x="632" y="467" font-size="20" font-family="Arial,sans-serif" fill="#345873">잘못된 JSON·범위 초과</text><text x="48" y="609" font-size="19" font-family="Arial,sans-serif" fill="#5c7288">Lesson 09 · Tool Calling Basics</text></svg>