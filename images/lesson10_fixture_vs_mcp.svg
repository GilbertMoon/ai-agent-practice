<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="Fixture와 실제 MCP 통신의 차이"><title>Fixture와 실제 MCP 통신의 차이</title><rect width="1200" height="640" fill="#f8fafc"/><text x="47" y="72" font-size="36" font-weight="bold" font-family="Arial,sans-serif" fill="#193f60">Fixture와 실제 MCP 통신의 차이</text><text x="49" y="115" font-size="21" font-family="Arial,sans-serif" fill="#526d83">둘 다 모델 API는 호출하지 않지만, 실제 프로토콜 통신 여부가 다릅니다.</text><rect x="50" y="190" width="505" height="318" rx="16" fill="#e5efff" stroke="#7a9dbb" stroke-width="2"/><text x="69" y="228" font-size="24" font-family="Arial,sans-serif" font-weight="bold" fill="#183e61">Fixture · 로컬 함수</text><text x="69" y="266" font-size="20" font-family="Arial,sans-serif" fill="#315672">함수를 직접 호출</text><text x="69" y="302" font-size="20" font-family="Arial,sans-serif" fill="#315672">MCP Client 연결 없음</text><text x="69" y="338" font-size="20" font-family="Arial,sans-serif" fill="#315672">SDK 설치 없어도 진행 가능</text><text x="69" y="374" font-size="20" font-family="Arial,sans-serif" fill="#315672">프로토콜 통신 검증 아님</text><rect x="645" y="190" width="505" height="318" rx="16" fill="#e5f3e7" stroke="#7a9dbb" stroke-width="2"/><text x="664" y="228" font-size="24" font-family="Arial,sans-serif" font-weight="bold" fill="#183e61">MCP · stdio 통신</text><text x="664" y="266" font-size="20" font-family="Arial,sans-serif" fill="#315672">서버 프로세스 실행</text><text x="664" y="302" font-size="20" font-family="Arial,sans-serif" fill="#315672">MCP ClientSession 사용</text><text x="664" y="338" font-size="20" font-family="Arial,sans-serif" fill="#315672">Tool · Resource · Prompt 조회</text><text x="664" y="374" font-size="20" font-family="Arial,sans-serif" fill="#315672">모델 API 호출 0회</text><text x="49" y="616" font-size="18" font-family="Arial,sans-serif" fill="#597189">Lesson 10 · Model Context Protocol</text></svg>