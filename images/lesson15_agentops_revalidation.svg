<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="840" viewBox="0 0 1500 840" role="img" aria-label="AgentOps: 실패 감지부터 재검증·보고까지"><title>AgentOps: 실패 감지부터 재검증·보고까지</title><rect width="1500" height="840" fill="#f6f9fd"/><rect x="22" y="22" width="1456" height="794" rx="18" fill="#fff" stroke="#c7d6e7" stroke-width="3"/><text x="65" y="92" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="40" fill="#163e6b" font-weight="800">AgentOps: 실패 감지부터 재검증·보고까지</text><text x="65" y="137" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="22" fill="#5a7690" font-weight="500">실패 로그를 삭제하지 않고 원인·조치·재검증을 연결합니다.</text><rect x="68" y="185" width="660" height="134" rx="18" fill="#edf4fe" stroke="#c7d6e7" stroke-width="3"/><text x="101" y="241" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="29" fill="#20517c" font-weight="800">1. 실행·관측</text><text x="101" y="283" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="23" fill="#436584" font-weight="500">게이트 출력과 HTTP 기록</text><rect x="788" y="185" width="660" height="134" rx="18" fill="#fff0ee" stroke="#c7d6e7" stroke-width="3"/><text x="821" y="241" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="29" fill="#20517c" font-weight="800">2. 실패 감지</text><text x="821" y="283" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="23" fill="#436584" font-weight="500">누락·오류 → HOLD</text><rect x="68" y="362" width="660" height="134" rx="18" fill="#edf4fe" stroke="#c7d6e7" stroke-width="3"/><text x="101" y="418" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="29" fill="#20517c" font-weight="800">3. 원인 분석</text><text x="101" y="460" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="23" fill="#436584" font-weight="500">실제 증거로 문제 파악</text><rect x="788" y="362" width="660" height="134" rx="18" fill="#edf4fe" stroke="#c7d6e7" stroke-width="3"/><text x="821" y="418" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="29" fill="#20517c" font-weight="800">4. 안전한 조치</text><text x="821" y="460" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="23" fill="#436584" font-weight="500">로컬 코드·설정 수정</text><rect x="68" y="539" width="660" height="134" rx="18" fill="#edf4fe" stroke="#c7d6e7" stroke-width="3"/><text x="101" y="595" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="29" fill="#20517c" font-weight="800">5. 재검증</text><text x="101" y="637" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="23" fill="#436584" font-weight="500">게이트 + 회귀 + HTTP</text><rect x="788" y="539" width="660" height="134" rx="18" fill="#e8f6ec" stroke="#c7d6e7" stroke-width="3"/><text x="821" y="595" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="29" fill="#20517c" font-weight="800">6. 결과 보고</text><text x="821" y="637" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="23" fill="#436584" font-weight="500">이전 실패와 최종 상태 모두</text><text x="90" y="742" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="22" fill="#715c4b" font-weight="700">운영 배포·자동 롤백 구현이 아니라 교육용 점검·재검증 절차 개념도입니다.</text><text x="66" y="776" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="18" fill="#6c8197" font-weight="500">Lesson 15 · 개념 설명용 그림 / 실제 테스트 실행 증거 아님</text></svg>