<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="840" viewBox="0 0 1500 840" role="img" aria-label="정답·출처 존재 판정과 HOLD의 차이"><title>정답·출처 존재 판정과 HOLD의 차이</title><rect width="1500" height="840" fill="#f5f8fc"/><rect x="28" y="28" width="1444" height="782" rx="18" fill="#fff" stroke="#c3d6e7" stroke-width="3"/><text x="66" y="92" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="42" fill="#173d69" font-weight="800" text-anchor="start">정답·출처 존재 판정과 HOLD의 차이</text><text x="66" y="141" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="23" fill="#55728e" font-weight="500" text-anchor="start">학습용 기준: answer_ok AND source_ok. 실제 서비스에는 올바른 보류를 평가하는 별도 규칙이 필요합니다.</text><rect x="86" y="200" width="1318" height="101" rx="18" fill="#e9f0ff" stroke="#c3d6e7" stroke-width="3"/><text x="133" y="244" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="29" fill="#244c7b" font-weight="800" text-anchor="start">교육용 평가 규칙</text><text x="133" y="279" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="23" fill="#183d66" font-weight="500" text-anchor="start">정답 문자열 일치? → 출처 이름 존재? → 모두 True이면 PASS</text><rect x="88" y="366" width="615" height="272" rx="18" fill="#e9f7ef" stroke="#c3d6e7" stroke-width="3"/><text x="128" y="420" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="26" fill="#207449" font-weight="800" text-anchor="start">답 일치 + 출처 이름 있음</text><text x="128" y="473" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="25" fill="#255d48" font-weight="500" text-anchor="start">answer_ok = True</text><text x="128" y="518" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="25" fill="#255d48" font-weight="500" text-anchor="start">source_ok = True</text><text x="128" y="575" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="27" fill="#187443" font-weight="800" text-anchor="start">PASS  (교육용 평가)</text><rect x="793" y="366" width="615" height="272" rx="18" fill="#fff0ef" stroke="#dfaaa3" stroke-width="3"/><text x="833" y="420" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="27" fill="#a74742" font-weight="800" text-anchor="start">'자료 없음' + 출처 없음</text><text x="833" y="473" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="25" fill="#784743" font-weight="500" text-anchor="start">answer_ok = True</text><text x="833" y="518" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="25" fill="#a74742" font-weight="500" text-anchor="start">source_ok = False</text><text x="833" y="575" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="27" fill="#aa453d" font-weight="800" text-anchor="start">FAIL  (현재 규칙)</text><text x="95" y="697" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="22" fill="#264f7c" font-weight="700" text-anchor="start">중요: 근거 없는 질문에 올바르게 HOLD했는지는 별도의 abstention 평가 정책으로 검증해야 합니다.</text><text x="66" y="776" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="19" fill="#6a8097" font-weight="500" text-anchor="start">Lesson 13 · 교육용 Fixture / 실제 모델 성능·API 비용 측정 아님</text></svg>