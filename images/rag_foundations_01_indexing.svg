<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="475" viewBox="0 0 1100 475" role="img" aria-labelledby="t desc"><title id="t">RAG의 사전 준비: 인덱싱</title><desc id="desc">도서관이 문을 열기 전에 책을 정리하는 과정. 문서 수집에서 문서 분할에서 임베딩·저장.</desc><rect width="1100" height="475" rx="28" fill="#f1f5f9"/><rect x="0" y="0" width="1100" height="126" rx="28" fill="#102a43"/><rect x="0" y="96" width="1100" height="30" fill="#102a43"/><text x="46" y="52" font-size="33" font-weight="800" fill="white" font-family="Arial, 'Noto Sans KR', sans-serif">RAG의 사전 준비: 인덱싱</text><text x="47" y="94" font-size="20" fill="#dbeafe" font-family="Arial, 'Noto Sans KR', sans-serif">도서관이 문을 열기 전에 책을 정리하는 과정</text><g font-family="Arial, 'Noto Sans KR', sans-serif"><rect x="45" y="174" width="300" height="178" rx="20" fill="#ffffff" stroke="#2563eb" stroke-width="3"/><circle cx="87" cy="215" r="19" fill="#2563eb"/><text x="87" y="221" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">1</text><text x="195" y="260" font-size="27" font-weight="700" text-anchor="middle" fill="#16233b">문서 수집</text><text x="195" y="305" font-size="18" text-anchor="middle" fill="#475569">책을 가져오기</text><rect x="395" y="174" width="300" height="178" rx="20" fill="#ffffff" stroke="#0d9488" stroke-width="3"/><circle cx="437" cy="215" r="19" fill="#0d9488"/><text x="437" y="221" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">2</text><text x="545" y="260" font-size="27" font-weight="700" text-anchor="middle" fill="#16233b">문서 분할</text><text x="545" y="305" font-size="18" text-anchor="middle" fill="#475569">내용을 작은 메모로 나누기</text><rect x="745" y="174" width="300" height="178" rx="20" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/><circle cx="787" cy="215" r="19" fill="#7c3aed"/><text x="787" y="221" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">3</text><text x="895" y="260" font-size="27" font-weight="700" text-anchor="middle" fill="#16233b">임베딩·저장</text><text x="895" y="305" font-size="18" text-anchor="middle" fill="#475569">의미별 위치를 기록하기</text><path d="M350 263 H390 M700 263 H740" stroke="#64748b" stroke-width="5" stroke-linecap="round"/><path d="M378 251 L393 263 L378 275 M728 251 L743 263 L728 275" fill="none" stroke="#64748b" stroke-width="5" stroke-linejoin="round"/><rect x="45" y="380" width="1010" height="60" rx="16" fill="#e0e7ff"/><text x="550" y="417" font-size="21" font-weight="700" text-anchor="middle" fill="#243b65">질문이 오기 전 미리 준비 · 검색은 준비 후에 수행</text></g></svg>