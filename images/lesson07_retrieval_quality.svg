<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-label="분할 방식별 검색 품질 비교"><title>분할 방식별 검색 품질 비교</title><rect width="1200" height="660" fill="#f6f8fc"/><text x="58" y="72" font-family="Arial,sans-serif" font-weight="700" font-size="37" fill="#143c60">분할 방식별 검색 품질 비교</text><text x="60" y="116" font-family="Arial,sans-serif" font-size="21" fill="#48657b">같은 질문과 Top-K, 동일한 정답 근거를 사용합니다.</text><rect x="60" y="160" width="1080" height="90" rx="16" fill="#e2ecff" stroke="#7198bb" stroke-width="2"/><text x="80" y="200" font-family="Arial,sans-serif" font-weight="700" font-size="24" fill="#184c72">공통 질문</text><text x="80" y="243" font-family="Arial,sans-serif" font-size="21" fill="#23455c">과제 마감일은 언제인가요?</text><rect x="60" y="280" width="330" height="215" rx="16" fill="#f8edda" stroke="#7198bb" stroke-width="2"/><text x="80" y="320" font-family="Arial,sans-serif" font-weight="700" font-size="24" fill="#184c72">Fixed-size</text><text x="80" y="363" font-family="Arial,sans-serif" font-size="21" fill="#23455c">① 문맥이 잘린 청크</text><text x="80" y="399" font-family="Arial,sans-serif" font-size="21" fill="#23455c">② 다른 주제 청크</text><text x="80" y="435" font-family="Arial,sans-serif" font-size="21" fill="#23455c">③ 정답 근거 후보</text><rect x="430" y="280" width="330" height="215" rx="16" fill="#e5f2e5" stroke="#7198bb" stroke-width="2"/><text x="450" y="320" font-family="Arial,sans-serif" font-weight="700" font-size="24" fill="#184c72">Paragraph</text><text x="450" y="363" font-family="Arial,sans-serif" font-size="21" fill="#23455c">① 정답 근거 포함</text><text x="450" y="399" font-family="Arial,sans-serif" font-size="21" fill="#23455c">② 주변 문맥 보존</text><text x="450" y="435" font-family="Arial,sans-serif" font-size="21" fill="#23455c">③ 중복 낮음</text><rect x="800" y="280" width="340" height="215" rx="16" fill="#f1e9ff" stroke="#7198bb" stroke-width="2"/><text x="820" y="320" font-family="Arial,sans-serif" font-weight="700" font-size="24" fill="#184c72">Overlap</text><text x="820" y="363" font-family="Arial,sans-serif" font-size="21" fill="#23455c">① 정답 근거 포함</text><text x="820" y="399" font-family="Arial,sans-serif" font-size="21" fill="#23455c">② 경계 문맥 일부</text><text x="820" y="435" font-family="Arial,sans-serif" font-size="21" fill="#23455c">③ 중복량 증가</text><text x="74" y="555" font-family="Arial,sans-serif" font-size="21" fill="#234d68">평가: Hit@3 · 정답 근거 포함 여부 · 청크 경계 · 중복</text><text x="60" y="628" font-family="Arial,sans-serif" font-size="19" fill="#536b7e">Lesson 07 · Chunking &amp; Retrieval Quality</text></svg>