<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="한 문서를 세 가지 방식으로 나누기"><title>한 문서를 세 가지 방식으로 나누기</title><rect width="1280" height="720" fill="#f6f8fc"/><rect x="32" y="28" width="1216" height="664" rx="22" fill="#fff" stroke="#cfdded" stroke-width="3"/><text x="68" y="90" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="39" font-weight="800" fill="#143b68">한 문서를 세 가지 방식으로 나누기</text><text x="68" y="131" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="21" fill="#435b77">세 방법 모두 장단점이 있으며, 문서와 질문에 따라 적절한 전략이 달라집니다.</text><rect x="55" y="166" width="1170" height="105" rx="14" fill="#f2f5fa" stroke="#9cb5d0" stroke-width="2"/><text x="78" y="205" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="25" font-weight="800" fill="#143b68">동일 원문</text><text x="252" y="205" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="23" font-weight="500" fill="#204567">과제 마감은 금요일 오후 6시입니다. 제출 방법은 LMS에 안내되어 있습니다.</text><text x="78" y="244" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="19" font-weight="500" fill="#204567">아래 세 방법의 차이는 어디에서 자르는가, 얼마나 겹치는가입니다.</text><rect x="55" y="306" width="377" height="292" rx="14" fill="#e7f0ff" stroke="#9cb5d0" stroke-width="2"/><text x="73" y="348" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="27" font-weight="800" fill="#193b63">① Fixed-size</text><text x="73" y="393" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="21" font-weight="500" fill="#204567">문자 수가 기준</text><rect x="75" y="425" width="153" height="49" rx="14" fill="#fff" stroke="#9cb5d0" stroke-width="2"/><rect x="239" y="425" width="169" height="49" rx="14" fill="#fff" stroke="#9cb5d0" stroke-width="2"/><text x="87" y="455" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="19" font-weight="500" fill="#204567">앞 160자</text><text x="248" y="455" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="19" font-weight="500" fill="#204567">다음 160자</text><text x="75" y="533" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="20" font-weight="500" fill="#aa482a">문장 중간이 잘릴 수 있음</text><rect x="454" y="306" width="377" height="292" rx="14" fill="#e4f4e8" stroke="#9cb5d0" stroke-width="2"/><text x="472" y="348" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="27" font-weight="800" fill="#193b63">② Paragraph</text><text x="472" y="393" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="21" font-weight="500" fill="#204567">빈 줄로 구분한 문단이 기준</text><rect x="474" y="425" width="153" height="49" rx="14" fill="#fff" stroke="#9cb5d0" stroke-width="2"/><rect x="638" y="425" width="169" height="49" rx="14" fill="#fff" stroke="#9cb5d0" stroke-width="2"/><text x="486" y="455" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="19" font-weight="500" fill="#204567">문단 A</text><text x="647" y="455" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="19" font-weight="500" fill="#204567">문단 B</text><text x="474" y="533" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="20" font-weight="500" fill="#aa482a">청크 길이가 제각각일 수 있음</text><rect x="853" y="306" width="377" height="292" rx="14" fill="#fff0de" stroke="#9cb5d0" stroke-width="2"/><text x="871" y="348" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="27" font-weight="800" fill="#193b63">③ Overlap</text><text x="871" y="393" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="21" font-weight="500" fill="#204567">고정 길이 + 일부 내용 반복</text><rect x="873" y="425" width="153" height="49" rx="14" fill="#fff" stroke="#9cb5d0" stroke-width="2"/><rect x="1037" y="425" width="169" height="49" rx="14" fill="#fff" stroke="#9cb5d0" stroke-width="2"/><text x="885" y="455" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="19" font-weight="500" fill="#204567">앞 160자</text><text x="1046" y="455" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="19" font-weight="500" fill="#204567">30자 겹침</text><text x="873" y="533" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="20" font-weight="500" fill="#aa482a">중복 저장량 증가</text><text x="72" y="632" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="20" font-weight="700" fill="#173d6b">핵심: Fixed-size는 길이, Paragraph는 문단 경계, Overlap은 공유 구간을 기준으로 이해합니다.</text><text x="68" y="667" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="18" fill="#61768c">Lesson 07 · 설명용 개념 그림 (실측 결과 아님)</text></svg>