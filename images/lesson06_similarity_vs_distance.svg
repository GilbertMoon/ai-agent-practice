<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Lesson 06 코사인 유사도와 코사인 거리 비교: 0.9 대 0.1, 유사도는 클수록 가깝고 거리는 작을수록 가깝다"><rect width="1280" height="720" fill="#f5f8fe"/><rect x="35" y="35" width="1210" height="650" rx="30" fill="#fff" stroke="#dce5f1" stroke-width="3"/><text x="75" y="105" font-size="43" fill="#233652" font-weight="600" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif">Lesson 06  |  Similarity vs Distance</text><text x="75" y="159" font-size="27" fill="#667994" font-weight="500" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif">같은 벡터 쌍을 두 가지 지표로 표현한 예시</text>
<rect x="84" y="205" width="520" height="276" rx="23" fill="#eaf7f0" stroke="#acd9be" stroke-width="3"/><rect x="676" y="205" width="520" height="276" rx="23" fill="#eaf3ff" stroke="#b6d1f4" stroke-width="3"/>
<text x="118" y="262" font-size="32" fill="#21794e" font-weight="600" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif">코사인 유사도 (Similarity)</text><text x="220" y="384" font-size="94" fill="#178653" font-weight="800" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif">0.9</text><text x="190" y="442" font-size="28" fill="#21794e" font-weight="600" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif">클수록 비슷함 ↑</text>
<text x="704" y="262" font-size="32" fill="#2366a7" font-weight="600" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif">코사인 거리 (Distance)</text><text x="821" y="384" font-size="94" fill="#236ec2" font-weight="800" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif">0.1</text><text x="790" y="442" font-size="28" fill="#2366a7" font-weight="600" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif">작을수록 가까움 ↓</text>
<rect x="84" y="503" width="1112" height="73" rx="18" fill="#203d63"/><text x="155" y="553" font-size="34" fill="#fff" font-weight="700" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif">이번 코사인 거리 = 1 − 코사인 유사도</text>
<text x="84" y="630" font-size="27" fill="#a13a43" font-weight="650" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif">주의: distance = 0.8은 ‘정답 확률 80%’가 아닙니다.</text></svg>