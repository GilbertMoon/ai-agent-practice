<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="Hit@K와 MRR의 차이"><title>Hit@K와 MRR의 차이</title><rect width="1200" height="640" fill="#f7f9fc"/><text x="50" y="73" font-size="36" font-weight="bold" fill="#173e60" font-family="Arial,sans-serif">Hit@K와 MRR의 차이</text><text x="52" y="116" font-size="20" fill="#53697f" font-family="Arial,sans-serif">Hit@3은 포함 여부, MRR은 첫 정답의 순위를 반영</text><rect x="45" y="170" width="525" height="350" rx="16" fill="#e5f3e5" stroke="#7197b8" stroke-width="2"/><text x="63" y="209" font-size="23" font-family="Arial,sans-serif" font-weight="bold" fill="#153f62">질문 A · 정답 1위</text><text x="63" y="245" font-size="20" font-family="Arial,sans-serif" fill="#28516f">1위  ✓ 정답 근거</text><text x="63" y="279" font-size="20" font-family="Arial,sans-serif" fill="#28516f">2위  다른 근거</text><text x="63" y="313" font-size="20" font-family="Arial,sans-serif" fill="#28516f">3위  다른 근거</text><text x="63" y="347" font-size="20" font-family="Arial,sans-serif" fill="#28516f">Hit@3 = 1</text><text x="63" y="381" font-size="20" font-family="Arial,sans-serif" fill="#28516f">RR = 1 / 1 = 1.0</text><rect x="620" y="170" width="525" height="350" rx="16" fill="#f9efd7" stroke="#7197b8" stroke-width="2"/><text x="638" y="209" font-size="23" font-family="Arial,sans-serif" font-weight="bold" fill="#153f62">질문 B · 정답 3위</text><text x="638" y="245" font-size="20" font-family="Arial,sans-serif" fill="#28516f">1위  다른 근거</text><text x="638" y="279" font-size="20" font-family="Arial,sans-serif" fill="#28516f">2위  다른 근거</text><text x="638" y="313" font-size="20" font-family="Arial,sans-serif" fill="#28516f">3위  ✓ 정답 근거</text><text x="638" y="347" font-size="20" font-family="Arial,sans-serif" fill="#28516f">Hit@3 = 1</text><text x="638" y="381" font-size="20" font-family="Arial,sans-serif" fill="#28516f">RR = 1 / 3 = 0.333</text><text x="50" y="615" font-size="18" fill="#58748c" font-family="Arial,sans-serif">Lesson 08 · Retrieval Quality &amp; Evidence Grounding</text></svg>