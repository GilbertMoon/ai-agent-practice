le SD Gothic Neo, Noto Sans KR, sans-serif" font-size="37" font-weight="800" fill="#173f70">생성 · Generation</text><text x="1185" y="453" text-anchor="middle" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="27" font-weight="500" fill="#344d68">선택된 문단을 모델 입력에 넣습니다</text><text x="1185" y="502" text-anchor="middle" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="27" font-weight="500" fill="#344d68">실제 API는 선택적으로 호출합니다</text><text x="1185" y="551" text-anchor="middle" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="27" font-weight="500" fill="#344d68">생성 답변과 근거를 따로 검증합니다</text><path d="M746 474 L842 474" stroke="#5178ac" stroke-width="6"  fill="none"/><path d="M828 464 L842 474 L828 484" fill="none" stroke="#5178ac" stroke-width="6"/><rect x="205" y="726" width="1190" height="67" rx="22" fill="#edf3fc" stroke="#c8d9ed" stroke-width="3"/><text x="800" y="772" text-anchor="middle" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="27" font-weight="700" fill="#173f70">주의: 검색 결과가 있다는 사실만으로 정답의 근거가 충분해지지는 않습니다.</text><text x="800" y="845" text-anchor="middle" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="23" font-weight="500" fill="#7790aa">AI Agent Engineering · RAG 첫걸음</text></svg>