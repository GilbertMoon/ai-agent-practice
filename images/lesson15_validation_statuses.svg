<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="840" viewBox="0 0 1500 840" role="img" aria-label="완료·미완료·범위 제외를 정확히 기록하기"><title>완료·미완료·범위 제외를 정확히 기록하기</title><rect width="1500" height="840" fill="#f6f9fd"/><rect x="22" y="22" width="1456" height="794" rx="18" fill="#fff" stroke="#c7d6e7" stroke-width="3"/><text x="65" y="92" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="40" fill="#163e6b" font-weight="800">완료·미완료·범위 제외를 정확히 기록하기</text><text x="65" y="137" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="22" fill="#5a7690" font-weight="500">실제 실행 근거가 없으면 PASS라고 말하지 않습니다.</text><rect x="70" y="175" width="1360" height="79" rx="18" fill="#edf1fa" stroke="#c7d6e7" stroke-width="3"/><text x="106" y="224" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="25" fill="#224e7c" font-weight="800">DESIGN_ONLY</text><text x="747" y="224" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="24" fill="#335d7b" font-weight="500">설계만 작성</text><rect x="70" y="264" width="1360" height="79" rx="18" fill="#edf1fa" stroke="#c7d6e7" stroke-width="3"/><text x="106" y="313" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="25" fill="#224e7c" font-weight="800">IMPLEMENTED_NOT_VERIFIED</text><text x="747" y="313" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="24" fill="#335d7b" font-weight="500">코드 작성 / 검증 전</text><rect x="70" y="353" width="1360" height="79" rx="18" fill="#fff3e2" stroke="#c7d6e7" stroke-width="3"/><text x="106" y="402" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="25" fill="#224e7c" font-weight="800">NOT_RUN</text><text x="747" y="402" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="24" fill="#335d7b" font-weight="500">실행하지 않음</text><rect x="70" y="442" width="1360" height="79" rx="18" fill="#e3f5eb" stroke="#c7d6e7" stroke-width="3"/><text x="106" y="491" font-family="Malgun Gothic,Noto Sans KR,Aria