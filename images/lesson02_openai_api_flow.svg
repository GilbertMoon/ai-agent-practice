<rect x="65" y="525" width="1052" height="48" rx="12" fill="#e4edf7"/>
<text x="591" y="557" font-size="21" text-anchor="middle" fill="#17365c">.env는 로컬에만 저장 · GitHub 공개 금지 · Mock 모드는 실제 API 호출 없음</text>
