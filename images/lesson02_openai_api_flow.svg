<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="title desc">
<title id="title">Lesson 02 OpenAI API 요청·응답 구조</title>
<desc id="desc">사용자 질문에서 Python 프로그램으로 이동하고, .env에서 읽은 모델과 API Key를 사용해 OpenAI Responses API에 요청한다. 모델 답변과 토큰 사용량이 Python 프로그램을 거쳐 화면으로 돌아온다. API Key는 GitHub에 저장하지 않는다.</desc>
<rect width="1200" height="600" rx="26" fill="#f6f9ff"/>
<text x="60" y="80" font-family="Arial, sans-serif" font-size="38" font-weight="bold" fill="#183254">질문 하나가 AI 답변으로 돌아오는 과정</text>
<g font-family="Arial, sans-serif" font-size="27" font-weight="bold" text-anchor="middle">
<rect x="65" y="142" width="240" height="150" rx="18" fill="#dbeafe" stroke="#3478d4" stroke-width="3"/>
<text x="185" y="200" fill="#17365c">사용자 질문</text><text x="185" y="245" font-size="21" font-weight="normal" fill="#17365c">터미널 입력</text>
<rect x="395" y="142" width="260" height="150" rx="18" fill="#e6f7ef" stroke="#21946a" stroke-width="3"/>
<text x="525" y="200" fill="#12593f">Python 프로그램</text><text x="525" y="245" font-size="21" font-weight="normal" fill="#12593f">main.py</text>
<rect x="752" y="142" width="365" height="150" rx="18" fill="#f2e8ff" stroke="#8463b7" stroke-width="3"/>
<text x="935" y="195" fill="#433061">OpenAI Responses API</text><text x="935" y="239" font-size="21" font-weight="normal" fill="#433061">모델 처리 · 응답 생성</text>
</g>
<g stroke="#375b85" stroke-width="5" fill="none" stroke-linecap="round"><path d="M306 190 H388"/><path d="M657 190 H746"/><path d="M748 261 H660"/><path d="M389 261 H310"/></g>
<g fill="#375b85"><path d="M390 190 l-16 -10 v20z"/><path d="M747 190 l-16 -10 v20z"/><path d="M657 261 l16 -10 v20z"/><path d="M307 261 l16 -10 v20z"/></g>
<text x="693" y="129" font-size="20" fill="#375b85">요청</text><text x="693" y="314" font-size="20" fill="#375b85">응답 + Usage</text>
