<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="검증 실패 시 HOLD"><title>검증 실패 시 HOLD</title><rect width="1200" height="640" fill="#f8fafc"/><text x="46" y="74" font-size="36" font-family="Arial,sans-serif" font-weight="bold" fill="#173e60">검증 실패 시 HOLD</text><text x="48" y="114" font-size="21" font-family="Arial,sans-serif" fill="#536b80">정답 근거가 없으면 다음 도구 호출을 실행하지 않습니다.</text><rect x="40" y="222" width="322" height="240" rx="16" fill="#e4efff" stroke="#799ab8" stroke-width="2"/><text x="58" y="262" font-size="23" font-family="Arial,sans-serif" font-weight="bold" fill="#173e61">STEP 1 · 검색</text><text x="58" y="302" font-size="20" font-family="Arial,sans-serif" fill="#315572">공지에서 제출 기한</text><text x="58" y="338" font-size="20" font-family="Arial,sans-serif" fill="#315572">근거와 출처 확인</text><path d="M 376 327 h55 m-14 -10 l14 10 -14 10" stroke="#347aab" stroke-width="4" fill="none"/><rect x="480" y="190" width="300" height="135" rx="16" fill="#e1f3e3" stroke="#799ab8" stroke-width="2"/><text x="498" y="230" font-size="23" font-family="Arial,sans-serif" font-weight="bold" fill="#173e61">근거 있음</text><text x="498" y="270" font-size="20" font-family="Arial,sans-serif" fill="#315572">PASS → STEP 2 계산</text><rect x="480" y="374" width="300" height="135" rx="16" fill="#ffeadc" stroke="#799ab8" stroke-width="2"/><text x="498" y="414" font-size="23" font-family="Arial,sans-serif" font-weight="bold" fill="#173e61">근거 없음</text><text x="498" y="454" font-size="20" font-family="Arial,sans-serif" fill="#315572">FAIL → HOLD</text><path d="M390 333 V438 H465" stroke="#bd846a" stroke-width="3" fill="none"/><rect x="850" y="254" width="303" height="198" rx="16" fill="#eee8fa" stroke="#799ab8" stroke-width="2"/><text x="868" y="294" font-size="23" font-family="Arial,sans-serif" font-weight="bold" fill="#173e61">최종 상태</text><text x="868" y="334" font-size="20" font-family="Arial,sans-serif" fill="#315572">완료: 모두 검증</text><text x