<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" width="1200" height="610" role="img" aria-labelledby="title desc"><title id="title">Lesson 04 문서 검색과 근거 기반 질문답변 흐름</title><desc id="desc">사용자 질문에서 키워드 검색을 거쳐 관련 문단을 찾고, 근거가 있으면 프롬프트와 OpenAI API를 연결한다. 근거가 없으면 API 호출 없이 답변을 보류한다.</desc><rect width="1200" height="610" fill="#f6f9fd"/><text x="60" y="73" fill="#193753" font-family="Arial,sans-serif" font-weight="bold" font-size="38">RAG 첫걸음: 먼저 근거를 찾습니다</text><g font-family="Arial,sans-serif" font-size="25" text-anchor="middle"><rect x="65" y="141" width="220" height="116" rx="14" fill="#d9e9ff" stroke="#487cc0" stroke-width="3"/><text x="175" y="210" fill="#244e83">사용자 질문</text><rect x="360" y="141" width="240" height="116" rx="14" fill="#e5f3e7" stroke="#398b56" stroke-width="3"/><text x="480" y="190" fill="#205b34">키워드로</text><text x="480" y="226" fill="#205b34">문단 검색</text><rect x="687" y="141" width="225" height="116" rx="14" fill="#f5e9ff" stroke="#9368b4" stroke-width="3"/><text x="799" y="189" fill="#583b74">관련 문단</text><text x="799" y="226" fill="#583b74">근거 확인</text><rect x="963" y="141" width="180" height="116" rx="14" fill="#e2ecff" stroke="#5a80ad" stroke-width="3"/><text x="1053" y="188" fill="#284d70">AI 모델</text><text x="1053" y="226" fill="#284d70">답변 생성</text></g><path d="M285 199 H360 M600 199 H687 M912 199 H963" fill="none" stroke="#56718a" stroke-width="5"/><path d="M798 258 V355 H596" fill="none" stroke="#c17c3e" stroke-width="5" stroke-dasharray="9 7"/><rect x="346" y="353" width="500" height="108" rx="16" fill="#fff3e5" stroke="#cd9350" stroke-width="3"/><text x="596" y="395" text-anchor="middle" font-family="Arial,sans-serif" fill="#7e4b19" font-size="28">관련 근거를 찾지 못했다면?</text><text x="596" y="432" text-anchor="middle" font-family="Arial,sans-serif" fill="#7e4b19" font-size="22">API 호출 없이 답변 보류</text><rect x="65" y="524" width="1078" height="56" rx="12" fill="#dfebf7"/><text x="604" y="559" font-size="21" text-anchor="middle" font-family="Arial,sans-serif" fill="#1d456e">현재 단계는 단순 키워드 검색 · 의미 검색과 벡터 DB는 다음 강의에서 배웁니다</text></svg>