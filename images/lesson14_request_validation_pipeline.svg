<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" role="img" aria-label="POST /ask 처리 흐름: 요청부터 JSON 응답까지"><title>POST /ask 처리 흐름: 요청부터 JSON 응답까지</title><rect width="1500" height="850" fill="#f5f8fc"/><rect x="25" y="25" width="1450" height="800" rx="19" fill="#fff" stroke="#c9d8eb" stroke-width="3"/><text x="62" y="91" fill="#183e67" font-size="42" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-weight="800">POST /ask 처리 흐름: 요청부터 JSON 응답까지</text><text x="64" y="144" fill="#61748b" font-size="23" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-weight="500">입력 계약과 업무 처리를 분리해야 응답을 해석할 수 있습니다.</text><rect x="78" y="188" width="1345" height="91" rx="19" fill="#e7effc" stroke="#c9d8eb" stroke-width="3"/><text x="118" y="243" fill="#244f7c" font-size="27" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-weight="800">클라이언트 → POST /ask / JSON Body: {question: ...}</text><path d="M751 285 L751 329" stroke="#5381ac" stroke-width="5" fill="none"/><rect x="110" y="341" width="1280" height="100" rx="19" fill="#eef2f9" stroke="#c9d8eb" stroke-width="3"/><text x="158" y="387" fill="#275880" font-size="27" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-weight="800">AskRequest / Pydantic: 타입·길이·공백 확인</text><text x="158" y="421" fill="#9b534b" font-size="21" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-weight="500">거부되는 입력은 HTTP 422 (라우터 실행 전)</text><path d="M751 448 L751 493" stroke="#5381ac" stroke-width="5" fill="none"/><rect x="112" y="501" width="1280" height="103" rx="19" fill="#e9f6ed" stroke="#c9d8eb" stroke-width="3"/><text x="158" y="552" fill="#216b49" font-size="27" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-weight="800">ask() → fixture_ask() → AskResponse</text><text x="158" y="585" fill="#366d53" font-size="21" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-weight="500">이번 수업은 두 가지 미리 정한 질문만 응답, 실제 LLM 호출 0회</text><path d="M751 611 L751 653" stroke="#5381ac" stroke-width="5" fill="none"/><rect x="110" y="666" width="1280" height="71" rx="19" fill="#edf5ff" stroke="#c9d8eb" stroke-width="3"/><text x="158" y="712" fill="#244e7c" font-size="26" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-weight="800">200 + COMPLETED   /   200 + HOLD   /   학습용 오류 503</text><text x="64" y="788" fill="#667e96" font-size="19" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-weight="500">Lesson 14 · 개념 설명용 그림 / 실제 HTTP 실행 화면이 아닙니다.</text></svg>