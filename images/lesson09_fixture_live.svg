<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="Fixture와 실제 Tool Calling 분리"><title>Fixture와 실제 Tool Calling 분리</title><rect width="1200" height="640" fill="#f7f9fc"/><text x="45" y="70" font-size="37" font-family="Arial,sans-serif" font-weight="bold" fill="#153d60">Fixture와 실제 Tool Calling 분리</text><text x="48" y="113" font-size="21" font-family="Arial,sans-serif" fill="#536b80">Fixture는 규칙 시뮬레이션, Live는 실제 모델의 함수 호출 요청입니다.</text><rect x="55" y="182" width="505" height="345" rx="17" fill="#e2efff" stroke="#7a9cb9" stroke-width="2"/><text x="72" y="222" font-size="23" font-weight="bold" font-family="Arial,sans-serif" fill="#173e61">Fixture · 기본</text><text x="72" y="260" font-size="20" font-family="Arial,sans-serif" fill="#345873">문자열 규칙으로 요청 흉내</text><text x="72" y="296" font-size="20" font-family="Arial,sans-serif" fill="#345873">예: 12 + 30</text><text x="72" y="332" font-size="20" font-family="Arial,sans-serif" fill="#345873">실제 모델 API 호출 0회</text><text x="72" y="368" font-size="20" font-family="Arial,sans-serif" fill="#345873">동작·검증을 무료로 연습</text><rect x="640" y="182" width="505" height="345" rx="17" fill="#e4f2e7" stroke="#7a9cb9" stroke-width="2"/><text x="657" y="222" font-size="23" font-weight="bold" font-family="Arial,sans-serif" fill="#173e61">Live · 선택</text><text x="657" y="260" font-size="20" font-family="Arial,sans-serif" fill="#345873">OpenAI Responses API 호출</text><text x="657" y="296" font-size="20" font-family="Arial,sans-serif" fill="#345873">모델이 도구 요청 여부 선택</text><text x="657" y="332" font-size="20" font-family="Arial,sans-serif" fill="#345873">프로그램이 인자 검증 후 실행</text><text x="657" y="368" font-size="20" font-family="Arial,sans-serif" fill="#345873">사용량·비용 발생 가능</text><text x="48" y="609" font-size="19" font-family="Arial,sans-serif" fill="#5c7288">Lesson 09 · Tool Calling Basics</text></svg>