<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">프롬프트와 Context의 차이</title><desc id="desc">같은 질문을 두 가지 경로로 보내 비교한다. 기본 프롬프트는 질문만 전달하고 구조화 프롬프트는 역할·목표·제약·출력 형식·참고 자료를 함께 전달한다. 응답 형식과 품질은 별도로 확인해야 한다.</desc><rect width="1200" height="560" fill="#f7faff"/><text x="50" y="64" font-size="37" font-weight="bold" font-family="Arial,sans-serif" fill="#163455">같은 질문, 다른 프롬프트 설계</text><rect x="60" y="112" width="245" height="94" rx="15" fill="#dfebff" stroke="#5280c7" stroke-width="3"/><text x="182" y="169" text-anchor="middle" font-size="27" font-family="Arial,sans-serif" fill="#173e70">사용자 질문</text><path d="M305 158 H385 V300 H445 M385 158 V165 H445" fill="none" stroke="#47729e" stroke-width="4"/><rect x="445" y="110" width="305" height="105" rx="14" fill="#ffeacf" stroke="#cb9043" stroke-width="3"/><text x="598" y="153" text-anchor="middle" font-size="26" font-family="Arial,sans-serif" fill="#6a431a">기본 프롬프트</text><text x="598" y="189" text-anchor="middle" font-size="20" font-family="Arial,sans-serif" fill="#6a431a">질문만 전달</text><rect x="445" y="256" width="305" height="178" rx="14" fill="#dff5e9" stroke="#3b9a75" stroke-width="3"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#155a42"><text x="598" y="296" font-size="26">구조화 프롬프트</text><text x="598" y="335" font-size="21">역할 · 목표 · 제약</text><text x="598" y="371" font-size="21">출력 형식 · 참고 맥락</text><text x="598" y="410" font-size="19">필요한 정보만 포함</text></g><rect x="862" y="162" width="270" height="183" rx="15" fill="#eae7ff" stroke="#796bba" stroke-width="3"/><text x="998" y="226" text-anchor="middle" font-size="27" font-family="Arial,sans-serif" fill="#433c76">OpenAI 모델</text><text x="998" y="272" text-anchor="middle" font-size="20" font-family="Arial,sans-serif" fill="#433c76">응답 생성</text><path d="M750 165 H862 M750 342 H805 V291 H862" fill="none" stroke="#47729e" stroke-width="4"/><rect x="60" y="475" width="1072" height="58" rx="12" fill="#e1ebf5"/><text x="596" y="511" text-anchor="middle" font-size="21" font-family="Arial,sans-serif" fill="#173e70">형식 지시만으로 정확성이 보장되지는 않습니다. 같은 모델 · 같은 질문 · 동일한 검증 기준으로 비교하세요.</text></svg>