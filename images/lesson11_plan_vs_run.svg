<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="830" viewBox="0 0 1500 830" role="img" aria-label="계획(PLAN)과 실제 실행(RUN)은 다릅니다"><title>계획(PLAN)과 실제 실행(RUN)은 다릅니다</title><rect width="1500" height="830" fill="#f6f9fd"/><rect x="25" y="26" width="1450" height="779" rx="16" stroke="#dce5f1" stroke-width="2.5" fill="#fff"/><text x="67" y="89" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="43" font-weight="800" fill="#173e69">계획(PLAN)과 실제 실행(RUN)은 다릅니다</text><text x="67" y="130" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="23" font-weight="500" fill="#5d718a">같은 도구가 등장해도 왼쪽에서는 실행하지 않고, 오른쪽에서만 실행·검증합니다.</text><rect x="64" y="174" width="661" height="523" rx="16" stroke="#c9d8e9" stroke-width="2.5" fill="#eaf2fe"/><rect x="774" y="174" width="662" height="523" rx="16" stroke="#c9d8e9" stroke-width="2.5" fill="#e9f6ef"/><text x="104" y="228" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="34" font-weight="800" fill="#1b518a">PLAN : 앞으로 할 일</text><text x="812" y="228" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="34" font-weight="800" fill="#1f754c">RUN : 실제로 수행한 일</text><rect x="100" y="269" width="582" height="101" rx="16" stroke="#c9d8e9" stroke-width="2.5" fill="#fff"/><text x="130" y="315" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="26" font-weight="500" fill="#173e69">STEP 1  공지 검색 예정</text><text x="130" y="350" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="22" font-weight="500" fill="#607c99">함수 실행 0회</text><rect x="100" y="392" width="582" height="101" rx="16" stroke="#c9d8e9" stroke-width="2.5" fill="#fff"/><text x="130" y="438" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="26" font-weight="500" fill="#173e69">STEP 2  계산 예정</text><text x="130" y="472" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="22" font-weight="500" fill="#607c99">아직 결과값 없음</text><rect x="100" y="539" width="582" height="100" rx="16" stroke="#c9d8e9" stroke-width="2.5" fill="#dce8fa"/><text x="130" y="595" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="29" font-weight="800" fill="#214f87">PLAN_ONLY  ≠  완료</text><rect x="807" y="269" width="595" height="101" rx="16" stroke="#c9d8e9" stroke-width="2.5" fill="#fff"/><text x="833" y="314" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="26" font-weight="500" fill="#173e69">STEP 1  공지 검색</text><text x="833" y="352" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="22" font-weight="500" fill="#217949">PASS: 제출 기한·출처 확인</text><rect x="807" y="392" width="595" height="101" rx="16" stroke="#c9d8e9" stroke-width="2.5" fill="#fff"/><text x="833" y="438" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="26" font-weight="500" fill="#173e69">STEP 2  계산</text><text x="833" y="475" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="22" font-weight="500" fill="#217949">PASS: 합계 42 검증</text><rect x="807" y="539" width="595" height="100" rx="16" stroke="#c9d8e9" stroke-width="2.5" fill="#d8f0e1"/><text x="835" y="595" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="29" font-weight="800" fill="#177247">COMPLETED: 2 / 2</text><text x="89" y="730" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="23" font-weight="800" fill="#24466f">핵심: 계획 목록을 화면에 출력해도 실제 검색·계산이 실행된 것은 아닙니다.</text><text x="66" y="768" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="500" fill="#71839a">Lesson 11 · 개념 설명 예시 (실제 실행 결과가 아닙니다)</text></svg>