  <line x1="405" y1="390" x2="435" y2="390" class="line"/>
  <g transform="translate(440,130)"><rect width="170" height="520" class="card"/><circle cx="85" cy="0" r="28" class="num"/><text x="85" y="9" class="numtxt">3</text><text x="85" y="65" class="stage">3단계:</text><text x="85" y="95" class="stage">RAG 기반</text><text x="85" y="125" class="stage">문서 검색 서비스</text><text x="85" y="215" class="icon">🔎</text><text x="18" y="310" class="bullet">• RAG 개념 이해</text><text x="18" y="345" class="bullet">• 문서 수집과 전처리</text><text x="18" y="380" class="bullet">• 임베딩과 벡터 저장소</text><text x="18" y="415" class="bullet">• 검색 및 응답 생성</text></g>
  <line x1="610" y1="390" x2="640" y2="390" class="line"/>
  <g transform="translate(645,130)"><rect width="170" height="520" class="card"/><circle cx="85" cy="0" r="28" class="num"/><text x="85" y="9" class="numtxt">4</text><text x="85" y="65" class="stage">4단계:</text><text x="85" y="95" class="stage">Tool Calling과</text><text x="85" y="125" class="stage">Agent 구조</text><text x="85" y="215" class="icon">🛠️</text><text x="18" y="310" class="bullet">• Tool Calling 개념</text><text x="18" y="345" class="bullet">• 도구 설계와 연동</text><text x="18" y="380" class="bullet">• Agent 구조 이해</text><text x="18" y="415" class="bullet">• 메모리와 상태 관리</text></g>
  <line x1="815" y1="390" x2="845" y2="390" class="line"/>
  <g transform="translate(850,130)"><rect width="170" height="520" class="card"/><circle cx="85" cy="0" r="28" class="num"/><text x="85" y="9" class="numtxt">5</text><text x="85" y="65" class="stage">5단계:</text><text x="85" y="95" class="stage">Workflow와</text><text x="85" y="125" class="stage">Multi-Agent 구조</text><text x="85" y="215" class="icon">🔁</text><text x="18" y="310" class="bullet">• Workflow 설계</text><text x="18" y="345" class="bullet">• 조건 분기와 반복 처리</text><text x="18" y="380" class="bullet">• Multi-Agent 패턴</text><text x="18" y="415" class="bullet">• 역할 분담과 협업</text></g>
