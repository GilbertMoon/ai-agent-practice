<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#1e5bb8"/></marker><style>.title{font-family:Arial,'Noto Sans KR',sans-serif;font-size:46px;font-weight:800;fill:#0b2f6b;text-anchor:middle}.card{fill:#fff;stroke:#8fb2df;stroke-width:3;rx:16}.num{fill:#0b57c2}.numtxt{font-family:Arial,sans-serif;font-size:24px;font-weight:800;fill:#fff;text-anchor:middle}.stage{font-family:Arial,'Noto Sans KR',sans-serif;font-size:20px;font-weight:800;fill:#0b57c2;text-anchor:middle}.bullet{font-family:Arial,'Noto Sans KR',sans-serif;font-size:15px;fill:#222}.icon{font-size:42px;text-anchor:middle}.line{stroke:#1e5bb8;stroke-width:4;fill:none;marker-end:url(#arrow)}.journey{font-family:Arial,'Noto Sans KR',sans-serif;font-size:24px;font-weight:800;fill:#0b57c2;text-anchor:middle}.small{font-family:Arial,'Noto Sans KR',sans-serif;font-size:18px;fill:#222;text-anchor:middle}</style></defs>
  <rect width="1400" height="900" fill="#fff"/><text x="700" y="60" class="title">AI Agent Engineering 학습 로드맵</text><line x1="420" y1="92" x2="980" y2="92" stroke="#1e5bb8" stroke-width="3"/>
  <g transform="translate(30,130)"><rect width="170" height="520" class="card"/><circle cx="85" cy="0" r="28" class="num"/><text x="85" y="9" class="numtxt">1</text><text x="85" y="65" class="stage">1단계:</text><text x="85" y="95" class="stage">생성형 AI</text><text x="85" y="125" class="stage">서비스 개발 기초</text><text x="85" y="215" class="icon">🤖</text><text x="18" y="310" class="bullet">• 생성형 AI 개념 이해</text><text x="18" y="345" class="bullet">• 서비스 개발 기본 흐름</text><text x="18" y="380" class="bullet">• 환경 세팅과 개발 도구</text><text x="18" y="415" class="bullet">• 간단한 챗봇 구현</text></g>
  <line x1="200" y1="390" x2="230" y2="390" class="line"/>
