  <line x1="1225" y1="390" x2="1255" y2="390" class="line"/>
  <g transform="translate(1260,130)"><rect width="115" height="520" class="card"/><circle cx="57" cy="0" r="28" class="num"/><text x="57" y="9" class="numtxt">7</text><text x="57" y="65" class="stage">7단계:</text><text x="57" y="95" class="stage">배포와</text><text x="57" y="125" class="stage">최종 프로젝트</text><text x="57" y="215" class="icon">🚀</text><text x="15" y="310" class="bullet">• 서비스 배포</text><text x="15" y="345" class="bullet">• 성능 최적화</text><text x="15" y="380" class="bullet">• 비용 관리</text><text x="15" y="415" class="bullet">• 프로젝트 완성</text></g>
  <rect x="80" y="700" width="1240" height="115" fill="#f4f8ff" stroke="#8fb2df" stroke-width="3" rx="18"/><text x="700" y="735" class="journey">학습 여정 요약</text><text x="220" y="785" class="journey" style="font-size:22px">기초 다지기</text><text x="430" y="785" class="journey" style="font-size:22px">직접 구현하기</text><text x="640" y="785" class="journey" style="font-size:22px">확장하기</text><text x="850" y="785" class="journey" style="font-size:22px">운영 준비하기</text><text x="1110" y="785" class="journey" style="font-size:22px">프로젝트 완성하기</text><line x1="310" y1="775" x2="360" y2="775" class="line"/><line x1="520" y1="775" x2="570" y2="775" class="line"/><line x1="730" y1="775" x2="780" y2="775" class="line"/><line x1="960" y1="775" x2="1010" y2="775" class="line"/>
  <rect x="120" y="840" width="1160" height="44" fill="#0b57c2" rx="14"/><text x="700" y="870" style="font-family:Arial,'Noto Sans KR',sans-serif;font-size:24px;font-weight:800;fill:#fff;text-anchor:middle">기초 → 구현 → 확장 → 운영 → 프로젝트 완성</text>
