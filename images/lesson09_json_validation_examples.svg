<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-label="JSON 문법이 맞아도 실행할 수 있을까?"><title>JSON 문법이 맞아도 실행할 수 있을까?</title><rect x="0" y="0" width="1440" height="810" rx="18" fill="#f6f9fe" stroke="#f6f9fe" stroke-width="3"/><rect x="22" y="22" width="1396" height="766" rx="18" fill="#fff" stroke="#d6e1ef" stroke-width="3"/><text x="65" y="90" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="40" font-weight="800" fill="#163c6b">JSON 문법이 맞아도 실행할 수 있을까?</text><text x="65" y="137" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="22" font-weight="500" fill="#57718d">출입 신청서의 양식이 맞는 것과 출입 권한을 허가하는 것은 별개입니다.</text><rect x="60" y="186" width="1320" height="88" rx="18" fill="#ecf2ff" stroke="#b4c9df" stroke-width="3"/><text x="93" y="241" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="27" font-weight="800" fill="#154671">입력 JSON</text><text x="752" y="241" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="27" font-weight="800" fill="#154671">문법</text><text x="961" y="241" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="27" font-weight="800" fill="#154671">인자 검증 → 실행</text><rect x="64" y="300" width="1310" height="82" rx="18" fill="#eaf7ed" stroke="#b4c9df" stroke-width="3"/><text x="95" y="351" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="24" font-weight="800" fill="#214c75">{"a":12,"b":30}</text><text x="762" y="351" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="24" font-weight="800" fill="#187343">정상</text><text x="965" y="351" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="23" font-weight="800" fill="#187343">✓ 허용</text><rect x="64" y="397" width="1310" height="82" rx="18" fill="#fff0ed" stroke="#b4c9df" stroke-width="3"/><text x="95" y="448" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="24" font-weight="800" fill="#214c75">{"a":true,"b":30}</text><text x="762" y="448" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="24" font-weight="800" fill="#aa403a">정상</text><text x="965" y="448" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="23" font-weight="800" fill="#aa403a">✕ 거부: bool은 정수 아님</text><rect x="64" y="494" width="1310" height="82" rx="18" fill="#fff0ed" stroke="#b4c9df" stroke-width="3"/><text x="95" y="545" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="24" font-weight="800" fill="#214c75">{"a":100001,"b":0}</text><text x="762" y="545" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="24" font-weight="800" fill="#aa403a">정상</text><text x="965" y="545" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="23" font-weight="800" fill="#aa403a">✕ 거부: 범위 초과</text><rect x="64" y="591" width="1310" height="82" rx="18" fill="#fff0ed" stroke="#b4c9df" stroke-width="3"/><text x="95" y="642" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="24" font-weight="800" fill="#214c75">{"a":12,}</text><text x="762" y="642" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="24" font-weight="800" fill="#aa403a">오류</text><text x="965" y="642" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="23" font-weight="800" fill="#aa403a">✕ 거부: JSON 문법 오류</text><text x="82" y="727" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="23" font-weight="800" fill="#244d7a">검증 순서: JSON 파싱 → 허용 도구 이름 → 정확한 키·타입·범위 → 실행</text><text x="65" y="755" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="500" fill="#6e8297">Lesson 09 · 개념 설명용 그림 (Live 실행 로그가 아닌 예시)</text></svg>