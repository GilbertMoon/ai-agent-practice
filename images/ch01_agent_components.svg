<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#1e5bb8"/></marker><style>.title{font-family:Arial,'Noto Sans KR',sans-serif;font-size:44px;font-weight:800;fill:#0b2f6b;text-anchor:middle}.hub{fill:#0b57c2;stroke:#083a83;stroke-width:5}.node{fill:#fff;stroke:#8fb2df;stroke-width:3;rx:18}.txt{font-family:Arial,'Noto Sans KR',sans-serif;font-size:23px;font-weight:700;fill:#111;text-anchor:middle}.eng{font-family:Arial,'Noto Sans KR',sans-serif;font-size:19px;font-weight:700;fill:#333;text-anchor:middle}.center{font-family:Arial,'Noto Sans KR',sans-serif;font-size:34px;font-weight:800;fill:#fff;text-anchor:middle}.icon{font-size:38px;text-anchor:middle}.num{fill:#0b57c2}.numtxt{font-family:Arial,sans-serif;font-size:20px;font-weight:800;fill:#fff;text-anchor:middle}.line{stroke:#1e5bb8;stroke-width:3;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1400" height="900" fill="#fff"/><text x="700" y="65" class="title">AI Agent Engineering의 핵심 구성 요소</text><line x1="180" y1="95" x2="1220" y2="95" stroke="#1e5bb8" stroke-width="3"/>
  <circle cx="700" cy="470" r="145" class="hub"/><text x="700" y="425" class="icon" style="font-size:52px">🤖</text><text x="700" y="485" class="center">AI Agent</text><text x="700" y="530" class="center">Engineering</text>
  <g transform="translate(580,120)"><rect width="240" height="125" class="node"/><circle cx="25" cy="25" r="19" class="num"/><text x="25" y="32" class="numtxt">1</text><text x="120" y="54" class="icon">🧠</text><text x="120" y="93" class="txt">대규모 언어 모델</text><text x="120" y="118" class="eng">(LLM)</text></g>
  <g transform="translate(900,170)"><rect width="245" height="125" class="node"/><circle cx="25" cy="25" r="19" class="num"/><text x="25" y="32" class="numtxt">2</text><text x="122" y="54" class="icon">💬</text><text x="122" y="93" class="txt">프롬프트</text><text x="122" y="118" class="eng">(Prompt)</text></g>
  <g transform="translate(1035,340)"><rect width="260" height="125" class="node"/><circle cx="25" cy="25" r="19" class="num"/><text x="25" y="32" class="numtxt">3</text><text x="130" y="54" class="icon">🔎</text><text x="130" y="93" class="txt">검색 증강 생성</text><text x="130" y="118" class="eng">(RAG)</text></g>
  <g transform="translate(1035,515)"><rect width="260" height="125" class="node"/><circle cx="25" cy="25" r="19" class="num"/><text x="25" y="32" class="numtxt">4</text><text x="130" y="54" class="icon">🛠️</text><text x="130" y="93" class="txt">도구 호출</text><text x="130" y="118" class="eng">(Tool Calling)</text></g>
  <g transform="translate(845,675)"><rect width="245" height="125" class="node"/><circle cx="25" cy="25" r="19" class="num"/><text x="25" y="32" class="numtxt">5</text><text x="122" y="54" class="icon">🧩</text><text x="122" y="93" class="txt">메모리</text><text x="122" y="118" class="eng">(Memory)</text></g>
  <g transform="translate(577,710)"><rect width="245" height="125" class="node"/><circle cx="25" cy="25" r="19" class="num"/><text x="25" y="32" class="numtxt">6</text><text x="122" y="54" class="icon">🔁</text><text x="122" y="93" class="txt">워크플로우</text><text x="122" y="118" class="eng">(Workflow)</text></g>
  <g transform="translate(310,675)"><rect width="245" height="125" class="node"/><circle cx="25" cy="25" r="19" class="num"/><text x="25" y="32" class="numtxt">7</text><text x="122" y="54" class="icon">📋</text><text x="122" y="93" class="txt">평가</text><text x="122" y="118" class="eng">(Evaluation)</text></g>
  <g transform="translate(110,515)"><rect width="260" height="125" class="node"/><circle cx="25" cy="25" r="19" class="num"/><text x="25" y="32" class="numtxt">8</text><text x="130" y="54" class="icon">🛡️</text><text x="130" y="93" class="txt">가드레일</text><text x="130" y="118" class="eng">(Guardrails)</text></g>
  <g transform="translate(110,340)"><rect width="260" height="125" class="node"/><circle cx="25" cy="25" r="19" class="num"/><text x="25" y="32" class="numtxt">9</text><text x="130" y="54" class="icon">📊</text><text x="130" y="93" class="txt">관측 가능성</text><text x="130" y="118" class="eng">(Observability)</text></g>
  <g transform="translate(255,170)"><rect width="245" height="125" class="node"/><circle cx="25" cy="25" r="19" class="num"/><text x="25" y="32" class="numtxt">10</text><text x="122" y="54" class="icon">☁️</text><text x="122" y="93" class="txt">배포</text><text x="122" y="118" class="eng">(Deployment)</text></g>
  <line x1="700" y1="325" x2="700" y2="250" class="line"/><line x1="810" y1="375" x2="900" y2="260" class="line"/><line x1="840" y1="455" x2="1035" y2="400" class="line"/><line x1="840" y1="510" x2="1035" y2="575" class="line"/><line x1="785" y1="590" x2="920" y2="675" class="line"/><line x1="700" y1="615" x2="700" y2="710" class="line"/><line x1="615" y1="590" x2="485" y2="675" class="line"/><line x1="560" y1="510" x2="370" y2="575" class="line"/><line x1="560" y1="455" x2="370" y2="400" class="line"/><line x1="590" y1="375" x2="500" y2="260" class="line"/>
