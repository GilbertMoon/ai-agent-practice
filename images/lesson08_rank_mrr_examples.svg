<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Hit@3과 MRR, 무엇이 다를까요?"><title>Hit@3과 MRR, 무엇이 다를까요?</title><rect x="0" y="0" width="1600" height="900" rx="0" fill="#f6f9fd" stroke="#f6f9fd" stroke-width="3"/><rect x="26" y="26" width="1548" height="848" rx="24" fill="#fff" stroke="#d7e3f1" stroke-width="3"/><rect x="64" y="56" width="160" height="56" rx="14" fill="#173e6e" stroke="#173e6e" stroke-width="3"/><text x="144" y="94" font-family="Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="24" font-weight="800" fill="#fff" text-anchor="middle">Lesson 08</text><text x="258" y="100" font-family="Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="49" font-weight="800" fill="#173c67" text-anchor="start">Hit@3과 MRR, 무엇이 다를까요?</text><text x="80" y="160" font-family="Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="25" font-weight="500" fill="#526b85" text-anchor="start">같은 Hit@3 = 1이어도 정답 문구가 처음 나타나는 순위에 따라 RR은 다릅니다.</text><rect x="70" y="208" width="452" height="420" rx="18" fill="#e5f2ff" stroke="#c6d8ea" stroke-width="3"/><text x="95" y="258" font-family="Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="31" font-weight="800" fill="#123e6f" text-anchor="start">질문 A</text><rect x="95" y="282" width="401" height="68" rx="12" fill="#c4ebcf" stroke="#67ae80" stroke-width="3"/><text x="116" y="324" font-family="Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="23" font-weight="700" fill="#176d42" text-anchor="start">1위  ✓ 정답 문구 포함</text><rect x="95" y="362" width="401" height="68" rx="12" fill="#fff" stroke="#c5d4e6" stroke-width="3"/><text x="116" y="404" font-family="Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="23" font-weight="700" fill="#547088" text-anchor="start">2위  다른 문구</text><rect x="95" y="442" width="401" height="68" rx="12" fill="#fff" stroke="#c5d4e6" stroke-width="3"/><text x="116" y="484" font-family="Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="23" font-weight="700" fill="#547088" text-anchor="start">3위  다른 문구</text><text x="96" y="580" font-family="Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="26" font-weight="800" fill="#193f69" text-anchor="start">Hit@3 = 1  |  RR = 1/1</text><rect x="574" y="208" width="452" height="420" rx="18" fill="#e9f6ef" stroke="#c6d8ea" stroke-width="3"/><text x="599" y="258" font-family="Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="31" font-weight="800" fill="#123e6f" text-anchor="start">질문 B</text><rect x="599" y="282" width="401" height="68" rx="12" fill="#fff" stroke="#c5d4e6" stroke-width="3"/><text x="620" y="324" font-family="Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="23" font-weight="700" fill="#547088" text-anchor="start">1위  다른 문구</text><rect x="599" y="362" width="401" height="68" rx="12" fill="#c4ebcf" stroke="#67ae80" stroke-width="3"/><text x="620" y="404" font-family="Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="23" font-weight="700" fill="#176d42" text-anchor="start">2위  ✓ 정답 문구 포함</text><rect x="599" y="442" width="401" height="68" rx="12" fill="#fff" stroke="#c5d4e6" stroke-width="3"/><text x="620" y="484" font-family="Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="23" font-weight="700" fill="#547088" text-anchor="start">3위  다른 문구</text><text x="600" y="580" font-family="Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="26" font-weight="800" fill="#193f69" text-anchor="start">Hit@3 = 1  |  RR = 1/2</text><rect x="1078" y="208" width="452" height="420" rx="18" fill="#fff0df" stroke="#c6d8ea" stroke-width="3"/><text x="1103" y="258" font-family="Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="31" font-weight="800" fill="#123e6f" text-anchor="start">질문 C</text><rect x="1103" y="282" width="401" height="68" rx="12" fill="#fff" stroke="#c5d4e6" stroke-width="3"/><text x="1124" y="324" font-family="Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="23" font-weight="700" fill="#547088" text-anchor="start">1위  다른 문구</text><rect x="1103" y="362" width="401" height="68" rx="12" fill="#fff" stroke="#c5d4e6" stroke-width="3"/><text x="1124" y="404" font-family="Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="23" font-weight="700" fill="#547088" text-anchor="start">2위  다른 문구</text><rect x="1103" y="442" width="401" height="68" rx="12" fill="#c4ebcf" stroke="#67ae80" stroke-width="3"/><text x="1124" y="484" font-family="Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="23" font-weight="700" fill="#176d42" text-anchor="start">3위  ✓ 정답 문구 포함</text><text x="1104" y="580" font-family="Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="26" font-weight="800" fill="#193f69" text-anchor="start">Hit@3 = 1  |  RR = 1/3</text><rect x="70" y="661" width="1438" height="130" rx="16" fill="#eff5ff" stroke="#abc8e9" stroke-width="3"/><text x="101" y="710" font-family="Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="29" font-weight="800" fill="#214f83" text-anchor="start">Hit@3 평균 = (1 + 1 + 1) ÷ 3 = 1.0</text><text x="101" y="754" font-family="Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="31" font-weight="800" fill="#214f83" text-anchor="start">MRR = (1 + 1/2 + 1/3) ÷ 3 ≈ 0.611</text><text x="950" y="737" font-family="Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="32" font-weight="800" fill="#b2463d" text-anchor="start">MRR ≠ 정답률 61.1%</text><text x="80" y="836" font-family="Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="21" font-weight="500" fill="#6d8195" text-anchor="start">개념 설명용 예시 · 교육용 문자열 검색 평가이며 실제 실행 결과는 아닙니다.</text></svg>