<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="840" viewBox="0 0 1500 840" role="img" aria-label="15강 과정: 단순 호출에서 검증 가능한 프로젝트까지"><title>15강 과정: 단순 호출에서 검증 가능한 프로젝트까지</title><rect width="1500" height="840" fill="#f6f9fd"/><rect x="22" y="22" width="1456" height="794" rx="18" fill="#fff" stroke="#c7d6e7" stroke-width="3"/><text x="65" y="92" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="40" fill="#163e6b" font-weight="800">15강 과정: 단순 호출에서 검증 가능한 프로젝트까지</text><text x="65" y="137" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="22" fill="#5a7690" font-weight="500">모든 기능을 연결하는 것이 목표가 아니라 필요한 기능과 검증 범위를 선택하는 것입니다.</text><rect x="62" y="189" width="1375" height="98" rx="18" fill="#eaf2ff" stroke="#c7d6e7" stroke-width="3"/><text x="96" y="240" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="27" fill="#255581" font-weight="800">01~03  CLI · Prompt · Model</text><text x="875" y="240" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="24" fill="#193e67" font-weight="500">사용자 질문 → 입력·출력</text><path d="M748 296 V335" stroke="#5281b0" stroke-width="5" fill="none"/><rect x="62" y="348" width="1375" height="97" rx="18" fill="#f1f5fb" stroke="#c7d6e7" stroke-width="3"/><text x="96" y="399" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="27" fill="#255581" font-weight="800">04~08  Document · RAG</text><text x="875" y="399" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="24" fill="#193e67" font-weight="500">검색 → 출처 검증</text><path d="M748 456 V493" stroke="#5281b0" stroke-width="5" fill="none"/><rect x="62" y="508" width="1375" height="96" rx="18" fill="#eaf5ef" stroke="#c7d6e7" stroke-width="3"/><text x="96" y="557" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="26" fill="#1a7050" font-weight="800">09~12  Tool · MCP · Agent · Memory</text><text x="875" y="557" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="24" fill="#193e67" font-weight="500">실행·HOLD·상태 저장</text><path d="M748 611 V640" stroke="#5281b0" stroke-width="5" fill="none"/><rect x="62" y="649" width="1375" height="83" rx="18" fill="#fff1dd" stroke="#c7d6e7" stroke-width="3"/><text x="96" y="700" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="26" fill="#875b2e" font-weight="800">13~15  Evaluation · FastAPI · AgentOps</text><text x="875" y="700" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="23" fill="#193e67" font-weight="500">평가 → HTTP → 검증 보고</text><text x="66" y="776" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="18" fill="#6c8197" font-weight="500">Lesson 15 · 개념 설명용 그림 / 실제 테스트 실행 증거 아님</text></svg>