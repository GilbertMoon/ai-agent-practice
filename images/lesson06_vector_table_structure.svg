<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t d"><title id="t">PostgreSQL 벡터 테이블 구조</title><desc id="d">lesson06_fixture_docs는 교육용 3차원 vector(3), lesson06_live_docs는 text-embedding-3-small의 1536차원 vector(1536)를 저장합니다. 두 테이블은 id, content, source, section, embedding 다섯 컬럼을 가집니다.</desc><defs></defs>
<rect x="0" y="0" width="1200" height="675" rx="0" fill="#f7f9fe"/>
<text x="52" y="62" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif" font-size="34" font-weight="bold" fill="#183454" text-anchor="start">PostgreSQL 벡터 테이블 구조</text>
<text x="52" y="100" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif" font-size="19" font-weight="normal" fill="#375777" text-anchor="start">문단의 이름표·원문·출처와 벡터를 한 행에 함께 저장합니다. Fixture와 Live는 테이블을 나눕니다.</text>
<rect x="40" y="126" width="540" height="404" rx="18" fill="#fff7e6" stroke="#d9a441" stroke-width="3"/>
<text x="310" y="166" font-family="Consolas,'D2Coding','Courier New',monospace" font-size="25" font-weight="bold" fill="#7a5200" text-anchor="middle">lesson06_fixture_docs</text>
<text x="310" y="196" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif" font-size="17" font-weight="normal" fill="#536174" text-anchor="middle">Fixture · 교육용 3차원 (사람이 정한 값)</text>
<rect x="60" y="214" width="500" height="50" rx="9" fill="#ffffff"/>
<text x="74" y="246" font-family="Consolas,'D2Coding','Courier New',monospace" font-size="19" font-weight="bold" fill="#7a5200" text-anchor="start">id</text>
<text x="196" y="246" font-family="Consolas,'D2Coding','Courier New',monospace" font-size="17" font-weight="normal" fill="#183454" text-anchor="start">TEXT PRIMARY KEY</text>
<text x="546" y="246" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif" font-size="17" font-weight="normal" fill="#536174" text-anchor="end">문단 ID</text>
<rect x="60" y="272" width="500" height="50" rx="9" fill="#ffffff"/>
<text x="74" y="304" font-family="Consolas,'D2Coding','Courier New',monospace" font-size="19" font-weight="bold" fill="#7a5200" text-anchor="start">content</text>
<text x="196" y="304" font-family="Consolas,'D2Coding','Courier New',monospace" font-size="17" font-weight="normal" fill="#183454" text-anchor="start">TEXT NOT NULL</text>
<text x="546" y="304" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif" font-size="17" font-weight="normal" fill="#536174" text-anchor="end">문단 원문</text>
<rect x="60" y="330" width="500" height="50" rx="9" fill="#ffffff"/>
<text x="74" y="362" font-family="Consolas,'D2Coding','Courier New',monospace" font-size="19" font-weight="bold" fill="#7a5200" text-anchor="start">source</text>
<text x="196" y="362" font-family="Consolas,'D2Coding','Courier New',monospace" font-size="17" font-weight="normal" fill="#183454" text-anchor="start">TEXT NOT NULL</text>
<text x="546" y="362" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif" font-size="17" font-weight="normal" fill="#536174" text-anchor="end">출처 파일</text>
<rect x="60" y="388" width="500" height="50" rx="9" fill="#ffffff"/>
<text x="74" y="420" font-family="Consolas,'D2Coding','Courier New',monospace" font-size="19" font-weight="bold" fill="#7a5200" text-anchor="start">section</text>
<text x="196" y="420" font-family="Consolas,'D2Coding','Courier New',monospace" font-size="17" font-weight="normal" fill="#183454" text-anchor="start">TEXT NOT NULL</text>
<text x="546" y="420" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif" font-size="17" font-weight="normal" fill="#536174" text-anchor="end">절 이름</text>
<rect x="60" y="446" width="500" height="50" rx="9" fill="#fffbe8" stroke="#d9a441" stroke-width="2.5"/>
<text x="74" y="478" font-family="Consolas,'D2Coding','Courier New',monospace" font-size="19" font-weight="bold" fill="#7a5200" text-anchor="start">embedding</text>
<text x="196" y="478" font-family="Consolas,'D2Coding','Courier New',monospace" font-size="17" font-weight="normal" fill="#183454" text-anchor="start">VECTOR(3) NOT NULL</text>
<text x="546" y="478" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif" font-size="17" font-weight="normal" fill="#536174" text-anchor="end">벡터</text>
<text x="74" y="518" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif" font-size="17" font-weight="normal" fill="#375777" text-anchor="start">예: notice-01 · 과제 제출 · [1,0,0]</text>
<rect x="620" y="126" width="540" height="404" rx="18" fill="#e8f1fd" stroke="#6f97cf" stroke-width="3"/>
<text x="890" y="166" font-family="Consolas,'D2Coding','Courier New',monospace" font-size="25" font-weight="bold" fill="#234b85" text-anchor="middle">lesson06_live_docs</text>
<text x="890" y="196" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif" font-size="17" font-weight="normal" fill="#536174" text-anchor="middle">Live · text-embedding-3-small 1536차원</text>
<rect x="640" y="214" width="500" height="50" rx="9" fill="#ffffff"/>
<text x="654" y="246" font-family="Consolas,'D2Coding','Courier New',monospace" font-size="19" font-weight="bold" fill="#234b85" text-anchor="start">id</text>
<text x="776" y="246" font-family="Consolas,'D2Coding','Courier New',monospace" font-size="17" font-weight="normal" fill="#183454" text-anchor="start">TEXT PRIMARY KEY</text>
<text x="1126" y="246" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif" font-size="17" font-weight="normal" fill="#536174" text-anchor="end">문단 ID</text>
<rect x="640" y="272" width="500" height="50" rx="9" fill="#ffffff"/>
<text x="654" y="304" font-family="Consolas,'D2Coding','Courier New',monospace" font-size="19" font-weight="bold" fill="#234b85" text-anchor="start">content</text>
<text x="776" y="304" font-family="Consolas,'D2Coding','Courier New',monospace" font-size="17" font-weight="normal" fill="#183454" text-anchor="start">TEXT NOT NULL</text>
<text x="1126" y="304" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif" font-size="17" font-weight="normal" fill="#536174" text-anchor="end">문단 원문</text>
<rect x="640" y="330" width="500" height="50" rx="9" fill="#ffffff"/>
<text x="654" y="362" font-family="Consolas,'D2Coding','Courier New',monospace" font-size="19" font-weight="bold" fill="#234b85" text-anchor="start">source</text>
<text x="776" y="362" font-family="Consolas,'D2Coding','Courier New',monospace" font-size="17" font-weight="normal" fill="#183454" text-anchor="start">TEXT NOT NULL</text>
<text x="1126" y="362" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif" font-size="17" font-weight="normal" fill="#536174" text-anchor="end">출처 파일</text>
<rect x="640" y="388" width="500" height="50" rx="9" fill="#ffffff"/>
<text x="654" y="420" font-family="Consolas,'D2Coding','Courier New',monospace" font-size="19" font-weight="bold" fill="#234b85" text-anchor="start">section</text>
<text x="776" y="420" font-family="Consolas,'D2Coding','Courier New',monospace" font-size="17" font-weight="normal" fill="#183454" text-anchor="start">TEXT NOT NULL</text>
<text x="1126" y="420" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif" font-size="17" font-weight="normal" fill="#536174" text-anchor="end">절 이름</text>
<rect x="640" y="446" width="500" height="50" rx="9" fill="#f1f7ff" stroke="#6f97cf" stroke-width="2.5"/>
<text x="654" y="478" font-family="Consolas,'D2Coding','Courier New',monospace" font-size="19" font-weight="bold" fill="#234b85" text-anchor="start">embedding</text>
<text x="776" y="478" font-family="Consolas,'D2Coding','Courier New',monospace" font-size="17" font-weight="normal" fill="#183454" text-anchor="start">VECTOR(1536) NOT NULL</text>
<text x="1126" y="478" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif" font-size="17" font-weight="normal" fill="#536174" text-anchor="end">벡터</text>
<text x="654" y="518" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif" font-size="17" font-weight="normal" fill="#375777" text-anchor="start">예: notice-01 · 과제 제출 · [0.01, -0.02, … ] 1536개</text>
<rect x="40" y="548" width="1120" height="72" rx="14" fill="#fdeeee" stroke="#d98c8c" stroke-width="2"/>
<text x="600" y="576" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif" font-size="19" font-weight="bold" fill="#8c2f2f" text-anchor="middle">차원이 다르면 같은 열에 넣을 수 없고, 서로 다른 방식으로 만든 벡터끼리는 비교하지 않습니다.</text>
<text x="600" y="604" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif" font-size="17" font-weight="normal" fill="#536174" text-anchor="middle">같은 id를 다시 저장하면 INSERT … ON CONFLICT (id) DO UPDATE로 기존 행을 갱신합니다 (STEP 10)</text>
<text x="600.0" y="649" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif" font-size="17" font-weight="normal" fill="#536174" text-anchor="middle">Live 예시 숫자는 형태를 보여 주는 값이며 실제 모델 출력이 아닙니다</text>
</svg>
