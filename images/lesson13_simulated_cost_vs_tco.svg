<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="840" viewBox="0 0 1500 840" role="img" aria-label="가상 토큰 비용과 실제 총소유비용(TCO)"><title>가상 토큰 비용과 실제 총소유비용(TCO)</title><rect width="1500" height="840" fill="#f5f8fc"/><rect x="28" y="28" width="1444" height="782" rx="18" fill="#fff" stroke="#c3d6e7" stroke-width="3"/><text x="66" y="92" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="42" fill="#173d69" font-weight="800" text-anchor="start">가상 토큰 비용과 실제 총소유비용(TCO)</text><text x="66" y="141" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="23" fill="#55728e" font-weight="500" text-anchor="start">가상의 입력 $1/100만 토큰 · 출력 $3/100만 토큰. 실제 공급자 요금표가 아닙니다.</text><rect x="66" y="197" width="666" height="437" rx="18" fill="#eaf2ff" stroke="#c3d6e7" stroke-width="3"/><text x="100" y="251" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="30" fill="#245386" font-weight="800" text-anchor="start">가상 모델 사용료 계산</text><text x="100" y="316" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="24" fill="#183d66" font-weight="500" text-anchor="start">입력 100토큰 × $1 / 1,000,000</text><text x="100" y="361" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="30" fill="#225d93" font-weight="800" text-anchor="start">= $0.0001</text><text x="100" y="428" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="24" fill="#183d66" font-weight="500" text-anchor="start">출력 200토큰 × $3 / 1,000,000</text><text x="100" y="474" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="30" fill="#225d93" font-weight="800" text-anchor="start">= $0.0006</text><text x="100" y="563" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="35" fill="#245386" font-weight="800" text-anchor="start">합계  $0.0007</text><rect x="777" y="197" width="656" height="437" rx="18" fill="#fff4e4" stroke="#e7cba3" stroke-width="3"/><text x="811" y="251" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="30" fill="#845a24" font-weight="800" text-anchor="start">TCO는 더 넓은 범위</text><text x="811" y="324" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="26" fill="#735832" font-weight="500" text-anchor="start">모델 사용료</text><text x="811" y="379" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="26" fill="#735832" font-weight="500" text-anchor="start">서버·DB·저장소</text><text x="811" y="434" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="26" fill="#735832" font-weight="500" text-anchor="start">로그·모니터링</text><text x="811" y="489" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="26" fill="#735832" font-weight="500" text-anchor="start">개발·유지보수·보안</text><text x="811" y="544" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="26" fill="#735832" font-weight="500" text-anchor="start">장애 대응·운영 인력</text><text x="87" y="705" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="25" fill="#9e443e" font-weight="800" text-anchor="start">가상 $0.0007은 실제 결제 금액도, 전체 TCO도 아닙니다.</text><text x="66" y="776" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="19" fill="#6a8097" font-weight="500" text-anchor="start">Lesson 13 · 교육용 Fixture / 실제 모델 성능·API 비용 측정 아님</text></svg>