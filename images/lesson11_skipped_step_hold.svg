<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="830" viewBox="0 0 1500 830" role="img" aria-label="앞 단계가 FAIL이면 후속 단계는 NOT_RUN"><title>앞 단계가 FAIL이면 후속 단계는 NOT_RUN</title><rect width="1500" height="830" fill="#f6f9fd"/><rect x="25" y="26" width="1450" height="779" rx="16" stroke="#dce5f1" stroke-width="2.5" fill="#fff"/><text x="67" y="89" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="43" font-weight="800" fill="#173e69">앞 단계가 FAIL이면 후속 단계는 NOT_RUN</text><text x="67" y="130" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="23" font-weight="500" fill="#5d718a">이 강의의 순차 의존 정책: 첫 번째 검색 실패 시 계산 도구 호출 없이 HOLD합니다.</text><rect x="95" y="182" width="1310" height="114" rx="16" stroke="#c9d8e9" stroke-width="2.5" fill="#e9f1ff"/><text x="140" y="230" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="29" font-weight="800" fill="#1a4b7d">계획: STEP 1 공지 검색 → STEP 2 계산</text><text x="140" y="272" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="500" fill="#173e69">먼저 정답 근거가 있는지 검증하고, 통과했을 때만 다음 단계로 갑니다.</text><path d="M746 305 V358" stroke="#4d7ea9" stroke-width="5" fill="none"/><path d="M736 346 L746 358 L756 346" stroke="#4d7ea9" stroke-width="4" fill="none"/><rect x="90" y="387" width="633" height="264" rx="16" stroke="#acd3b8" stroke-width="2.5" fill="#e6f6ec"/><rect x="777" y="387" width="633" height="264" rx="16" stroke="#e5b0ac" stroke-width="2.5" fill="#fff0ef"/><text x="122" y="445" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="29" font-weight="800" fill="#207547">✓ 검색·제출 기한 확인</text><text x="122" y="497" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="26" font-weight="500" fill="#206b44">STEP 1: PASS</text><text x="122" y="551" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="26" font-weight="500" fill="#206b44">STEP 2: 계산 실행</text><text x="122" y="606" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="27" font-weight="800" fill="#206b44">최종 COMPLETED 가능</text><text x="808" y="445" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="29" font-weight="800" fill="#aa423c">✕ 검색 근거 없음</text><text x="808" y="497" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="26" font-weight="500" fill="#983e39">STEP 1: FAIL</text><text x="808" y="551" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="26" font-weight="800" fill="#983e39">STEP 2: [NOT_RUN]</text><text x="808" y="606" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="26" font-weight="800" fill="#983e39">최종 HOLD · completed=1/2</text><text x="95" y="707" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="500" fill="#6d5b43">주의: 이번 수업의 의존 관계 예시입니다. 독립적인 업무는 반드시 모두 중단해야 한다는 뜻이 아닙니다.</text><text x="66" y="768" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="500" fill="#71839a">Lesson 11 · 개념 설명 예시 (실제 실행 결과가 아닙니다)</text></svg>